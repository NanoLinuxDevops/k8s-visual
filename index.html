async function applyDoc(doc) {
  const kind = doc.kind, md = doc.metadata || {}, name = md.name;
  if (!kind || !doc.apiVersion) return err('error: error validating data: [apiVersion not set, kind not set]; if you choose to ignore these errors, turn validation off with --validate=false');
  if (!name || !DNS1123.test(String(name))) return err(`error: error validating "STDIN": metadata.name: Required value / invalid value "${name || ''}"`);
  const spec = doc.spec || {};
  if (kind === 'Deployment') {
    const tpl = (spec.template || {}), c = ((tpl.spec || {}).containers || [])[0];
    if (!c || !c.image || !c.name) return err(`The Deployment "${name}" is invalid: spec.template.spec.containers: Required value`);
    if (!IMAGE_RE.test(String(c.image))) return err(`The Deployment "${name}" is invalid: spec.template.spec.containers[0].image: invalid reference format`);
    const sel = (spec.selector || {}).matchLabels || {}, labels = (tpl.metadata || {}).labels || {};
    if (!Object.keys(sel).length) return err(`The Deployment "${name}" is invalid: spec.selector: Required value`);
    if (!matches(sel, labels)) return err(`The Deployment "${name}" is invalid: spec.template.metadata.labels: Invalid value: ${JSON.stringify(labels)}: \`selector\` does not match template \`labels\``);
    const req = ((c.resources || {}).requests) || {};
    const cpu = parseCPU(req.cpu), mem = parseMem(req.memory), replicas = spec.replicas == null ? 1 : +spec.replicas;
    if (isNaN(cpu) || isNaN(mem) || cpu <= 0) return err(`The Deployment "${name}" is invalid: resources.requests: invalid quantity`);
    if (isNaN(replicas) || replicas < 0 || replicas > 40) return err(`The Deployment "${name}" is invalid: spec.replicas must be 0..40 in this simulator`);
    const template = { labels:{ ...labels }, container:String(c.name), image:String(c.image), cpu, mem };
    const d = findDep(name);
    if (!d) return writePath(`POST deployment <b>${name}</b> (server-side apply)`, () => S.deployments.push({ ...makeDeployment({ name, image:template.image, replicas }), selector:{ ...sel }, template }), `deployment.apps/${name} created`);
    if (JSON.stringify(d.selector) !== JSON.stringify(sel)) return err(`The Deployment "${name}" is invalid: spec.selector: Invalid value: field is immutable`);
    if (d.replicas === replicas && JSON.stringify(d.template) === JSON.stringify(template)) { await readPath('deployment/' + name); return print(`deployment.apps/${name} unchanged`); }
    return writePath(`PATCH deployment <b>${name}</b> (apply computes a diff against the live object)`, () => { d.replicas = replicas; d.template = template; }, `deployment.apps/${name} configured`);
  }
  if (kind === 'Service') {
    const p = (spec.ports || [])[0];
    if (!p || !p.port) return err(`The Service "${name}" is invalid: spec.ports: Required value`);
    const type = spec.type || 'ClusterIP';
    if (!['ClusterIP','NodePort','LoadBalancer'].includes(type)) return err(`The Service "${name}" is invalid: spec.type: Unsupported value: "${type}"`);
    const sel = spec.selector || {};
    const s = findSvc(name);
    if (!s) return createService({ name, type, selector:{ ...sel }, port:+p.port, targetPort:+(p.targetPort || p.port), nodePort:p.nodePort ? +p.nodePort : null }, `service/${name} created`);
    return writePath(`PATCH service <b>${name}</b>`, () => { Object.assign(s, { type, selector:{ ...sel }, port:+p.port, targetPort:+(p.targetPort || p.port), epSig:null }); if (type !== 'ClusterIP' && !s.nodePort) s.nodePort = 30000 + Math.floor(Math.random() * 2767); }, `service/${name} configured`);
  }
  if (kind === 'Pod') {
    const c = (spec.containers || [])[0];
    if (!c || !c.image) return err(`The Pod "${name}" is invalid: spec.containers: Required value`);
    if (findPod(name)) return print(`pod/${name} unchanged`);
    const req = ((c.resources || {}).requests) || {};
    return writePath(`POST pod <b>${name}</b>`, () => S.pods.push(makePod({ name, labels:md.labels || { run:name }, image:String(c.image), container:String(c.name || name), cpu:parseCPU(req.cpu), mem:parseMem(req.memory) })), `pod/${name} created`);
  }
  err(`error: resource mapping not found for name: "${name}" namespace: "" from "STDIN": no matches for kind "${kind}" in version "${doc.apiVersion}"\nensure CRDs are installed first`);
}

// ---- curl through a Service (round-robin across ready endpoints) ----
async function curlCmd(args) {
  const raw = args[0];
  if (!raw) return err('curl: try \'curl <service> [count]\'');
  const host = raw.replace(/^https?:\/\//, '').split('/')[0].split(':')[0].replace(/\.default(\.svc(\.cluster\.local)?)?$/, '');
  const count = Math.max(1, Math.min(20, parseInt(args[1], 10) || 1));
  const s = S.services.find(x => x.name === host || x.clusterIP === host || x.externalIP === host);
  if (!s) return print(`curl: (6) Could not resolve host: ${host}\nHint: curl a Service name — create one with "kubectl expose deployment <name> --port=80".`, 'err');
  const entry = s.type === 'LoadBalancer' ? `external LB ${s.externalIP || '<pending>'} → NodePort ${s.nodePort}` : s.type === 'NodePort' ? `&lt;nodeIP&gt;:${s.nodePort}` : `ClusterIP ${s.clusterIP}:${s.port}`;
  await step(`🌐 Client sends HTTP to <b>${entry}</b>. A Service is not a process — it's a virtual IP that <b>kube-proxy</b>'s iptables rules DNAT to a ready pod. Rotation here is round-robin (real iptables mode picks randomly).`);
  for (let i = 0; i < count; i++) {
    if (!s.endpoints.length) { await step(`No ready endpoints for <b>${s.name}</b> → connection refused.`, [['client','svc:' + s.name,C.del]], () => print(`curl: (7) Failed to connect to ${host} port ${s.port} after 0 ms: Couldn't connect to server`, 'err')); return; }
    const pname = s.endpoints[s.rr++ % s.endpoints.length], p = findPod(pname);
    if (!p || !p.ready || !p.nodeName) { await step(`Stale endpoint ${pname} (not yet removed by the EndpointSlice controller) → this request fails.`, [['client','svc:' + s.name,C.del]], () => print(`curl: (7) Failed to connect to ${host} port ${s.port}: Connection refused`, 'err')); continue; }
    await step(`Request ${i + 1}/${count}: iptables on <b>${p.nodeName}</b> picks endpoint <b>${p.name}</b> (${p.ip}:${s.targetPort}).`,
      [['client','svc:' + s.name,C.traffic],['svc:' + s.name,'proxy:' + p.nodeName,C.traffic],['proxy:' + p.nodeName,'pod:' + p.name,C.traffic],['pod:' + p.name,'client',C.ok]], () => {
        const b = imageBase(p.image);
        print(b === 'nginx' ? `<title>Welcome to nginx!</title>  ← served by ${p.name} (${p.ip}) on ${p.nodeName}` : `HTTP/1.1 200 OK  "hello from ${p.name}" (${p.ip}, ${b}) on ${p.nodeName}`, 'ok');
        p.logs.push(`10.244.0.1 - - [${new Date().toUTCString()}] "GET / HTTP/1.1" 200 615 "-" "curl/8.5.0" "-"`);
        (S.stats.curl[s.name] = S.stats.curl[s.name] || new Set()).add(p.name);
      });
  }
}

async function exec(line) {
  print('$ ' + line, 'in');
  S.history.push(line);
  const toks = tokenize(line);
  if (!toks.length) return;
  if (toks[0] === 'help' || (/^(kubectl|k)$/.test(toks[0]) && (!toks[1] || toks[1] === 'help' || toks[1] === '--help'))) return print(HELP, 'info');
  if (toks[0] === 'clear') { $('#out').innerHTML = ''; return; }
  if (toks[0] === 'curl') { beginTrace('$ ' + line); return curlCmd(toks.slice(1)); }
  let rest = toks;
  if (/^(kubectl|k)$/.test(toks[0])) rest = toks.slice(1);
  else if (!CMDS[toks[0]]) {
    const near = ['kubectl', 'curl', 'help', 'clear', ...Object.keys(CMDS)].find(c => levenshtein(c, toks[0]) <= 2);
    return print(`bash: ${toks[0]}: command not found${near ? `\nDid you mean "${near}"?` : ''}\nHint: commands start with "kubectl" (or "k"). Type "help".`, 'err');
  }
  const { args, flags } = parseArgs(rest);
  const verb = args[0];
  if (!verb) return print(HELP, 'info');
  if (!CMDS[verb]) {
    const sugg = Object.keys(CMDS).filter(c => levenshtein(c, verb) <= 2);
    return print(`error: unknown command "${verb}" for "kubectl"${sugg.length ? `\n\nDid you mean this?\n\t${sugg.join('\n\t')}` : ''}\n\nRun 'kubectl --help' for usage.`, 'err');
  }
  beginTrace('$ ' + line);
  await CMDS[verb](args.slice(1), flags);
}

// ---- command queue, history, tab completion ----
let chain = Promise.resolve(), queued = 0;
function enqueue(fn) {
  queued++; $('#busy').textContent = '⏳ running…';
  chain = chain.then(fn).catch(e => { if (e.message !== 'reset') { console.error(e); print('internal error: ' + e.message, 'err'); } })
    .finally(() => { if (--queued === 0) $('#busy').textContent = ''; checkLesson(); });
}
const runCmd = line => enqueue(() => exec(line));
const hist = []; let hi = 0;
const cmdEl = $('#cmd');
cmdEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const v = cmdEl.value.trim(); cmdEl.value = ''; if (!v) return; hist.push(v); hi = hist.length; runCmd(v); }
  else if (e.key === 'ArrowUp') { if (hi > 0) cmdEl.value = hist[--hi]; e.preventDefault(); }
  else if (e.key === 'ArrowDown') { hi = Math.min(hist.length, hi + 1); cmdEl.value = hist[hi] || ''; e.preventDefault(); }
  else if (e.key === 'Tab') { e.preventDefault(); tabComplete(); }
});
function completions(prev, cur) {
  const verbs = Object.keys(CMDS);
  if (cur.startsWith('-')) return ['--image=','--replicas=','--port=','--target-port=','--type=','-o','--force','--ignore-daemonsets','--tail=','--all','-f'];
  if (!prev.length) return ['kubectl','curl','help','clear', ...verbs];
  if (prev[0] === 'curl') return prev.length === 1 ? S.services.map(s => s.name) : [];
  const rel = /^(kubectl|k)$/.test(prev[0]) ? prev.slice(1) : prev;
  if (!rel.length) return verbs;
  const [verb] = rel, pos = rel.length;
  const names = k => ({ pod:S.pods, deployment:S.deployments, service:S.services, node:S.nodes, rs:S.replicasets }[k] || []).map(o => o.name);
  if (prev[prev.length - 1] === '-o') return ['wide','yaml','name'];
  if (cur.startsWith('--type=')) return ['--type=ClusterIP','--type=NodePort','--type=LoadBalancer'];
  if (['drain','cordon','uncordon'].includes(verb)) return pos === 1 ? names('node') : [];
  if (verb === 'logs') return pos === 1 ? [...names('pod'), ...names('deployment').map(n => 'deployment/' + n)] : [];
  if (verb === 'apply') return ['-f'];
  if (verb === 'rollout') return pos === 1 ? ['status','undo','history'] : pos === 2 ? names('deployment').map(n => 'deployment/' + n) : [];
  if (verb === 'set') return pos === 1 ? ['image'] : pos === 2 ? names('deployment').map(n => 'deployment/' + n) : pos === 3 ? (findDep((rel[2] || '').split('/')[1]) ? [findDep(rel[2].split('/')[1]).template.container + '='] : []) : [];
  if (verb === 'create') return pos === 1 ? ['deployment'] : [];
  if (verb === 'run') return [];
  const types = { get:['pods','nodes','deployments','rs','services','events','all'], describe:['pod','node','deployment','service'], delete:['pod','deployment','service','node','rs'], scale:['deployment'], expose:['deployment'] }[verb] || [];
  if (pos === 1) return types;
  if (pos >= 2 && KIND[rel[1]]) return names(KIND[rel[1]]);
  return [];
}
function tabComplete() {
  const v = cmdEl.value, toks = v.split(/\s+/), cur = toks.pop(), prev = toks.filter(Boolean);
  const m = completions(prev, cur).filter(c => c.startsWith(cur));
  if (!m.length) return;
  let fill = m[0];
  if (m.length > 1) {
    fill = m.reduce((a, b) => { let i = 0; while (i < a.length && a[i] === b[i]) i++; return a.slice(0, i); });
    if (fill === cur) { print(m.join('   '), 'info'); return; }
  }
  const sp = m.length === 1 && !/[=\/]$/.test(fill) ? ' ' : '';
  cmdEl.value = (prev.length ? v.slice(0, v.length - cur.length) : '') + fill + sp;
}

async function addNode() {
  if (S.nodes.length >= MAX_NODES) return print(`This board fits at most ${MAX_NODES} nodes.`, 'err');
  beginTrace('＋ Node: a new machine joins the cluster');
  const n = makeNode(); n.ready = false; n.notReadyMarked = true; n.downSince = now() + 1e9;
  S.nodes.push(n); scheduleRender(); await sleep(50);
  await step(`A new machine boots <b>${n.name}</b>. kubelet, kube-proxy and containerd start. kubelet <b>registers</b> a Node object (POST /api/v1/nodes) and starts heartbeating.`,
    [['kubelet:' + n.name,'api',C.req],['api','etcd',C.write]], () => {
      Object.assign(n, { ready:true, notReadyMarked:false, downSince:0 });
      ev('Normal', 'RegisteredNode', 'node/' + n.name, `Node ${n.name} event: Registered Node ${n.name} in Controller`, 'node-controller');
      ev('Normal', 'NodeReady', 'node/' + n.name, `Node ${n.name} status is now: NodeReady`, 'kubelet');
    });
  await step(`Node is <b>Ready</b>. Note: running pods are <b>not</b> rebalanced onto it — only new or Pending pods can land here.`);
}
async function powerOff(n, remove) {
  beginTrace(`💥 ${n.name} ${remove ? 'is removed (machine failure)' : 'loses power'}`);
  const a = anchor('node:' + n.name);
  if (a) { sparks(a.x, a.y, true); hotOn('node:' + n.name, 900); }
  await step(`💥 <b>${n.name}</b> ${remove ? 'is pulled from the rack' : 'loses power'}! Its kubelet stops renewing its Lease (heartbeat). Pods on it are frozen — but the API server doesn't know yet.`, [], () => {
    Object.assign(n, { ready:false, downSince:now(), deleting:!!remove });
    S.stats.nodeFailed++;
  });
}
async function powerOn(n) {
  beginTrace(`🔌 ${n.name} powers back on`);
  await step(`🔌 <b>${n.name}</b> boots. kubelet re-registers and heartbeats → node <b>Ready</b> again.`, [['kubelet:' + n.name,'api',C.ok],['api','etcd',C.write]], () => {
    Object.assign(n, { ready:true, notReadyMarked:false, downSince:0, deleting:false });
    ev('Normal', 'NodeReady', 'node/' + n.name, `Node ${n.name} status is now: NodeReady`, 'kubelet');
  });
}
async function breakIt() {
  const options = [];
  if (S.nodes.filter(n => n.ready).length > 1) options.push('node');
  options.push('image', 'resources');
  const pick = options[Math.floor(Math.random() * options.length)];
  beginTrace('⚡ Break it: a random failure was injected');
  print('⚡ Something just broke in the cluster! Investigate with: kubectl get pods / get nodes / describe … / logs … / get events', 'hint');
  if (pick === 'node') {
    const cands = S.nodes.filter(n => n.ready).sort((a, b) => nodeAlloc(b).count - nodeAlloc(a).count);
    return powerOff(cands[0], false);
  }
  if (pick === 'image') {
    const d = S.deployments[Math.floor(Math.random() * S.deployments.length)];
    if (d) {
      const bad = d.template.image.includes('nginx') ? d.template.image.replace('nginx', 'ngnix') : imageBase(d.template.image) + ':latst';
      return step(`A teammate's CI pipeline PATCHed deployment <b>${d.name}</b> with a new image… 🤔`, [['client','api',C.req],['api','etcd',C.write]], () => { d.template.image = bad; });
    }
    const pn = findDep('payments') ? 'payments-' + rand(3) : 'payments';
    return step(`A teammate deployed <b>${pn}</b> (2 replicas)… 🤔`, [['client','api',C.req],['api','etcd',C.write]], () => S.deployments.push(makeDeployment({ name:pn, image:'ngnix:1.27', replicas:2 })));
  }
  const name = findDep('ml-training') ? 'ml-training-' + rand(3) : 'ml-training';
  // Each node fits only one 1500m pod, so one more replica than Ready nodes can never all be placed.
  const replicas = Math.max(2, S.nodes.filter(n => n.ready).length + 1);
  return step(`A teammate deployed <b>${name}</b>: ${replicas} replicas, each requesting <b>1500m CPU / 2Gi</b>… 🤔`, [['client','api',C.req],['api','etcd',C.write]],
    () => S.deployments.push(makeDeployment({ name, image:'python:3.12', replicas, cpu:1500, mem:2048 })));
}
async function replay() {
  const t = lastTrace;
  if (!t || !t.steps.length) return print('Nothing to explain yet — run a command first.', 'info');
  replaying = true;
  $('#explainTitle').textContent = '⟲ Slow-motion replay: ' + t.title;

}

function objFromId(id) {

}
function tipFor(id) {
  if (CP[id]) {

      api:`${S.pods.length + S.deployments.length + S.replicasets.length + S.services.length + S.nodes.length} objects served`,
      etcd:`${S.pods.length + S.deployments.length + S.replicasets.length + S.services.length + S.nodes.length + S.events.length} keys stored`,
      sched:`${pendingPods().length} pod(s) waiting for a node`, cm:`${S.deployments.length} deployments · ${S.replicasets.length} replicasets watched` }[id];
    return `<b>${CP[id].label}</b><br>${CP[id].desc}<span class="st">State: ${st}</span>`;
  }

  if (!o) return '';

  if (k === 'node') { const a = nodeAlloc(o); return `<b>Node ${o.name}</b><br>A worker machine (VM or physical) that runs pods.<span class="st">${nodeStatusStr(o)}${o.ready ? '' : ' (no heartbeat)'} · ${a.count} pods · CPU ${a.cpu}/${o.cpu}m · MEM ${a.mem}/${o.mem}Mi</span>`; }
  if (k === 'kubelet') return `<b>kubelet @ ${o.name}</b><br>${NODE_DESC.kubelet}<span class="st">${o.ready ? 'heartbeating' : 'DOWN — no heartbeat'} · ${S.pods.filter(p => p.nodeName === o.name).length} pods</span>`;
  if (k === 'rt') return `<b>containerd @ ${o.name}</b><br>${NODE_DESC.rt}<span class="st">${S.pods.filter(p => p.nodeName === o.name && p.state === 'Running').length} containers running</span>`;
  if (k === 'proxy') return `<b>kube-proxy @ ${o.name}</b><br>${NODE_DESC.proxy}<span class="st">${S.services.length} service rule set(s)</span>`;
  if (k === 'svc') return `<b>Service ${o.name}</b> (${o.type})<br>A stable virtual IP + DNS name that load-balances to pods matching its selector.<span class="st">${o.clusterIP}:${o.port} · selector ${selStr(o.selector)} · ${o.endpoints.length} endpoint(s)</span>`;
  if (k === 'dep') { const st = depStatus(o); return `<b>Deployment ${o.name}</b><br>Declares desired pods + update strategy; manages ReplicaSets.<span class="st">${st.ready}/${o.replicas} ready · revision ${o.revision}${o.rolling ? ' · rolling update in progress' : ''}</span>`; }
  if (k === 'rs') return `<b>ReplicaSet ${o.name}</b><br>Keeps exactly N identical pods (one pod-template version) running.<span class="st">revision ${o.revision} · ${readyCount(o)}/${o.replicas} ready · ${esc(o.template.image)}</span>`;
  return '';
}

const link = (id, label) => `<a data-open="${esc(id)}">${esc(label)}</a>`;
const pre = s => `<pre>${esc(s)}</pre>`;
const act = (label, line, cls) => ({ label, cls, fn:() => { closeModal(); runCmd(line); } });

function openDetail(id) {
  if (CP[id]) return openModal(CP[id].label, `<p>${CP[id].desc}</p><h4>CURRENT STATE</h4>${cpState(id)}`, [{ label:'Refresh', fn:() => openDetail(id) }]);
  const { k, o } = objFromId(id);
  if (!o) return openModal('Gone', '<p>This object no longer exists.</p>');
  const refresh = { label:'↻ Refresh', fn:() => openDetail(id) };
  if (k === 'pod') {
    const d = depOfPod(o), svcs = S.services.filter(s => matches(s.selector, o.labels));
    const rel = [o.owner ? `ReplicaSet ${link('rs:' + o.owner, o.owner)}` : 'no owner (bare pod)', d ? `Deployment ${link('dep:' + d.name, d.name)}` : '', o.nodeName ? `Node ${link('node:' + o.nodeName, o.nodeName)}` : 'not scheduled', ...svcs.map(s => `Service ${link('svc:' + s.name, s.name)}`)].filter(Boolean);
    return openModal(`Pod ${o.name}`, `<h4>RELATED</h4>${rel.join(' · ')}<h4>SPEC & STATUS</h4>${pre(yaml(podManifest(o)))}<h4>EVENTS</h4>${pre(eventsFor('pod/' + o.name))}`,
      [refresh, act('kubectl describe', `kubectl describe pod ${o.name}`), act('kubectl logs', `kubectl logs ${o.name}`), act('Delete pod', `kubectl delete pod ${o.name}`, 'warn')]);
  }
  if (k === 'node' || k === 'kubelet' || k === 'rt' || k === 'proxy') {
    const pods = S.pods.filter(p => p.nodeName === o.name);
    let extra = '';
    if (k === 'kubelet') extra = `<h4>KUBELET</h4><p>${NODE_DESC.kubelet}</p>${pre(`heartbeat: ${o.ready ? 'renewing Lease every 10s' : 'STOPPED'}\npods managed:\n${pods.map(p => `  ${p.name.padEnd(32)} ${podStatus(p)}`).join('\n') || '  (none)'}`)}`;
    if (k === 'rt') extra = `<h4>CONTAINERD</h4><p>${NODE_DESC.rt}</p>${pre(table([['CONTAINER','IMAGE','STATE','POD'], ...pods.map(p => [p.state === 'Running' ? p.cid : '-', p.image, p.state === 'Running' ? 'Running' : p.state, p.name])]))}`;
    if (k === 'proxy') extra = `<h4>KUBE-PROXY (iptables, simplified)</h4><p>${NODE_DESC.proxy}</p>${pre(S.services.map(s => {
      const eps = s.endpoints.map(findPod).filter(Boolean), id8 = hashStr(s.name).slice(0, 8).toUpperCase();
      return `-A KUBE-SERVICES -d ${s.clusterIP}/32 -p tcp --dport ${s.port} -j KUBE-SVC-${id8}\n` + (eps.length ? eps.map((p, i) =>
        `-A KUBE-SVC-${id8} -m statistic --mode random --probability ${(1 / (eps.length - i)).toFixed(5)} -j KUBE-SEP-${hashStr(p.name).slice(0, 6).toUpperCase()}   # → ${p.ip}:${s.targetPort}`).join('\n')
        : `-A KUBE-SERVICES -d ${s.clusterIP}/32 -j REJECT   # no endpoints`);
    }).join('\n\n') || '# no services')}`;
    return openModal(`Node ${o.name}${k !== 'node' ? ' · ' + { kubelet:'kubelet', rt:'containerd', proxy:'kube-proxy' }[k] : ''}`,
      `${extra}<h4>PODS</h4>${pods.map(p => link('pod:' + p.name, p.name) + ` (${podStatus(p)})`).join('<br>') || '(none)'}<h4>NODE</h4>${pre(yaml(nodeManifest(o)))}<h4>EVENTS</h4>${pre(eventsFor('node/' + o.name))}`,
      [refresh, act('kubectl describe', `kubectl describe node ${o.name}`),
       o.unschedulable ? act('Uncordon', `kubectl uncordon ${o.name}`) : act('Cordon', `kubectl cordon ${o.name}`),
       act('Drain', `kubectl drain ${o.name} --ignore-daemonsets --force`),
       o.ready ? { label:'⚡ Power off', cls:'warn', fn:() => { closeModal(); enqueue(() => powerOff(o, false)); } } : { label:'🔌 Power on', fn:() => { closeModal(); enqueue(() => powerOn(o)); } }]);
  }
  if (k === 'svc') {
    const eps = o.endpoints.map(findPod).filter(Boolean);
    return openModal(`Service ${o.name}`, `<h4>ENDPOINTS (round-robin targets)</h4>${eps.map(p => link('pod:' + p.name, `${p.name} → ${p.ip}:${o.targetPort}`)).join('<br>') || '<i>none — no ready pods match the selector</i>'}<h4>SPEC</h4>${pre(yaml(svcManifest(o)))}<h4>EVENTS</h4>${pre(eventsFor('service/' + o.name))}`,
      [refresh, act('Send 6 requests', `curl ${o.name} 6`, 'primary'), act('kubectl describe', `kubectl describe service ${o.name}`), act('Delete', `kubectl delete service ${o.name}`, 'warn')]);
  }
  if (k === 'dep') {
    const rss = rsOfDep(o).sort((a, b) => b.revision - a.revision);
    return openModal(`Deployment ${o.name}`, `<h4>REPLICASETS (revision history)</h4>${rss.map(r => link('rs:' + r.name, `rev ${r.revision}: ${r.name} — ${readyCount(r)}/${r.replicas} ready — ${r.template.image}`)).join('<br>')}<h4>SPEC & STATUS</h4>${pre(yaml(depManifest(o)))}<h4>EVENTS</h4>${pre(eventsFor('deployment/' + o.name))}`,
      [refresh, act('Scale +1', `kubectl scale deployment ${o.name} --replicas=${o.replicas + 1}`), act('Scale −1', `kubectl scale deployment ${o.name} --replicas=${Math.max(0, o.replicas - 1)}`),
       act('Rollout undo', `kubectl rollout undo deployment/${o.name}`), act('Delete', `kubectl delete deployment ${o.name}`, 'warn')]);
  }
  if (k === 'rs') {
    const pods = podsOfRS(o);
    return openModal(`ReplicaSet ${o.name}`, `<h4>RELATED</h4>Owner: Deployment ${link('dep:' + o.owner, o.owner)}<h4>PODS</h4>${pods.map(p => link('pod:' + p.name, `${p.name} (${podStatus(p)})`)).join('<br>') || '(none)'}<h4>SPEC</h4>${pre(yaml(rsManifest(o)))}<h4>EVENTS</h4>${pre(eventsFor('replicaset/' + o.name))}`, [refresh]);
  }
}
function cpState(id) {
  if (id === 'etcd') {
    const keys = ['/registry/namespaces/default', ...S.nodes.map(n => '/registry/minions/' + n.name), ...S.deployments.map(d => '/registry/deployments/default/' + d.name),
      ...S.replicasets.map(r => '/registry/replicasets/default/' + r.name), ...S.pods.map(p => '/registry/pods/default/' + p.name),
      '/registry/services/specs/default/kubernetes', ...S.services.map(s => '/registry/services/specs/default/' + s.name)];
    return pre(`$ etcdctl get / --prefix --keys-only\n${keys.join('\n')}\n(+ ${S.events.length} event keys, leases, endpointslices…)`);
  }
  if (id === 'api') return pre(`Objects: ${S.nodes.length} nodes, ${S.pods.length} pods, ${S.deployments.length} deployments, ${S.replicasets.length} replicasets, ${S.services.length + 1} services\nWatchers: kube-scheduler, kube-controller-manager, ${S.nodes.length} kubelets, ${S.nodes.length} kube-proxies\nAdmission: NamespaceLifecycle, LimitRanger, ServiceAccount, DefaultTolerationSeconds, ResourceQuota …`);
  if (id === 'sched') return pre(`Pending pods:\n${pendingPods().map(p => `  ${p.name}: ${p.schedMsg || 'waiting'}`).join('\n') || '  (none)'}\n\nRecent bindings:\n${S.lastBindings.map(b => '  ' + b).join('\n') || '  (none)'}`);
  if (id === 'cm') return pre(`Running control loops (subset):\n  deployment         ${S.deployments.length} deployments${S.deployments.some(d => d.rolling) ? ' (rollout in progress)' : ''}\n  replicaset         ${S.replicasets.length} replicasets\n  node-lifecycle     ${S.nodes.filter(n => !n.ready).length} node(s) without heartbeat\n  endpointslice      ${S.services.length} services\n  garbage-collector  cascading deletes via ownerReferences\n  taint-eviction     evicts pods from unreachable nodes`);
  if (id === 'kubectl') return pre(S.history.slice(-15).join('\n') || '(no commands yet)');
  if (id === 'client') return `<p>Send traffic: <code class="try">curl ${S.services[0] ? S.services[0].name : 'web'} 6</code></p>`;
  return '';
}

/* =====================================================================
   10. GUIDED LESSONS
   Each lesson: task (HTML), check() against live state, why (HTML).
   ===================================================================== */
const ready = name => { const d = findDep(name); return d && depStatus(d).ready === d.replicas && depStatus(d).total === d.replicas && !d.rolling; };
const T = c => `<code class="try">${c}</code>`;
const LESSONS = [
  { title:'1 · Your first Pod',
    task:`Create a single pod running nginx and wait until its LED turns green.<br>${T('kubectl run hello --image=nginx')}<br>Then try ${T('kubectl get pods -o wide')}.`,
    check:() => findPod('hello')?.state === 'Running',
    why:`Your command only <b>wrote a Pod object to etcd</b>. The <b>scheduler</b> noticed a pod with no node and bound it; the <b>kubelet</b> on that node noticed a pod bound to it and asked <b>containerd</b> to start it. Nobody "pushed" anything — every component <i>watches</i> the API server.` },
  { title:'2 · Deployments & self-healing',
    task:`Create a Deployment with 3 replicas, then delete one of its pods and watch it come back.<br>${T('kubectl create deployment web --image=nginx --replicas=3')}<br>${T('kubectl get pods')} then ${T('kubectl delete pod <one-of-the-web-pods>')} (Tab completes names).`,
    check:() => S.stats.deletedFrom.has('web') && ready('web'),
    why:`A Deployment creates a <b>ReplicaSet</b>, which keeps <i>exactly N</i> pods matching its template. When you deleted a pod, the ReplicaSet controller saw <b>actual (2) &lt; desired (3)</b> and created a replacement. That's <b>reconciliation</b>: desired state in etcd, controllers closing the gap forever.` },
  { title:'3 · Scaling',
    task:`Scale <b>web</b> to 5 replicas and watch the scheduler spread them by free resources.<br>${T('kubectl scale deployment web --replicas=5')}<br>Then try scaling to 30 and see what happens to pods that don't fit!`,
    check:() => findDep('web')?.replicas >= 5 && ready('web'),
    why:`Scaling only changes one number: <code>spec.replicas</code>. The Deployment controller passes it to the ReplicaSet, which creates pods; the scheduler <b>filters</b> nodes by free CPU/memory (based on <i>requests</i>, not real usage) and <b>scores</b> the rest. Pods that fit nowhere stay <b>Pending</b> with a <code>FailedScheduling</code> event.` },
  { title:'4 · Services & load balancing',
    task:`Expose <b>web</b> and send traffic. Watch requests rotate across pods.<br>${T('kubectl expose deployment web --port=80 --type=LoadBalancer')}<br>${T('curl web 6')}`,
    check:() => findSvc('web') && (S.stats.curl.web?.size || 0) >= 2,
    why:`A Service is a stable <b>virtual IP</b> plus a label selector. The <b>EndpointSlice controller</b> tracks which ready pods match, and <b>kube-proxy</b> on every node turns that into iptables rules. Pods come and go; the Service IP stays the same.` },
  { title:'5 · Rolling updates & rollback',
    task:`Change the image, watch old/new ReplicaSets swap pods one at a time (pod border colors = revision), then roll back.<br>${T('kubectl set image deployment/web nginx=nginx:1.25')}<br>${T('kubectl rollout status deployment/web')}<br>${T('kubectl rollout undo deployment/web')}`,
    check:() => S.stats.undo > 0 && ready('web'),
    why:`Changing the pod template creates a <b>new ReplicaSet</b>. The Deployment controller scales it up by 1 (<b>maxSurge</b>), waits for the new pod to be <b>Ready</b>, then scales the old one down (<b>maxUnavailable=0</b>) — zero downtime. Old ReplicaSets are kept at 0 replicas, so <b>undo</b> is just switching back to one.` },
  { title:'6 · What happens when a node dies?',
    task:`Click a worker node that has pods and press <b>⚡ Power off</b> (or use the <b>－</b> button next to <b>Nodes</b> in the header). Watch the node lifecycle controller react, then wait until all deployments are healthy again.<br>${T('kubectl get nodes')} ${T('kubectl get pods -o wide')}`,
    check:() => S.stats.nodeFailed > 0 && S.deployments.length > 0 && S.deployments.every(d => ready(d.name)) && S.events.some(e => e.reason === 'TaintManagerEviction'),
    why:`Nodes prove they're alive by renewing a <b>Lease</b>. With no heartbeat the <b>node lifecycle controller</b> marks the node NotReady and taints it; pods that don't tolerate the taint are <b>evicted</b>. Their ReplicaSets then recreate them on healthy nodes. Bare pods (no owner) are simply lost.` },
  { title:'7 · Debugging ImagePullBackOff',
    task:`Deploy an image with a typo, investigate, then fix it.<br>${T('kubectl create deployment broken --image=ngnix --replicas=2')}<br>${T('kubectl get pods')} ${T('kubectl describe pod <broken-pod>')} ${T('kubectl get events')}<br>Fix: ${T('kubectl set image deployment/broken ngnix=nginx')}`,
    check:() => S.stats.sawBackoff.has('broken') && ready('broken'),
    why:`The pod was scheduled fine, but <b>containerd couldn't pull</b> the image, so the kubelet reported <b>ErrImagePull → ImagePullBackOff</b>. <code>describe</code> and <code>events</code> show the exact registry error. Fixing the template triggered a new ReplicaSet; the controller removed the unready old pods first.` },
  { title:'8 · Cordon & drain (maintenance)',
    task:`Safely empty a node for maintenance, then bring it back.<br>${T('kubectl drain node-1 --ignore-daemonsets')} (add ${T('--force')} if it complains about bare pods)<br>${T('kubectl uncordon node-1')}`,
    check:() => S.stats.drained > 0 && S.nodes.every(n => !n.unschedulable),
    why:`<b>cordon</b> sets <code>spec.unschedulable</code> so the scheduler skips the node. <b>drain</b> = cordon + <b>evict</b> every pod via the Eviction API (respecting PodDisruptionBudgets), so ReplicaSets recreate them elsewhere. <b>uncordon</b> re-enables scheduling — but running pods don't move back by themselves.` },
];
let lessonIdx = -1, lessonDone = new Set();
function showLesson(i) {
  lessonIdx = i;
  const L = LESSONS[i];
  $('#lesson').classList.remove('hidden');
  $('#lTitle').textContent = '📘 ' + L.title;
  $('#lProg').textContent = `${i + 1}/${LESSONS.length}`;
  $('#lTask').innerHTML = L.task;
  $('#lWhy').classList.add('hidden');
  $('#lPrev').disabled = i === 0; $('#lNext').disabled = i === LESSONS.length - 1;
  checkLesson();
}
function checkLesson() {
  if (lessonIdx < 0 || !S) return;
  const L = LESSONS[lessonIdx];
  let ok = false; try { ok = !!L.check(); } catch (e) { ok = false; }
  if (ok && $('#lWhy').classList.contains('hidden')) {
    $('#lWhy').innerHTML = `<b>✓ Done!</b> Why it worked: ${L.why}`;
    $('#lWhy').classList.remove('hidden');
    if (!lessonDone.has(lessonIdx)) { lessonDone.add(lessonIdx); print(`✓ Lesson complete: ${L.title}`, 'ok'); }
  }
}
function openLessonMenu() {
  openModal('Guided lessons', `<p>Short interactive tasks. Each one checks the live cluster and explains <i>why</i> it worked. Lessons 3–5 build on the <b>web</b> deployment from lesson 2.</p>` +
    LESSONS.map((L, i) => `<div class="lessonItem" data-lesson="${i}">${lessonDone.has(i) ? '✅' : '⬜'} <b>${L.title}</b></div>`).join(''), [{ label:'Close', fn:closeModal }]);
  document.querySelectorAll('[data-lesson]').forEach(el => el.onclick = () => { closeModal(); showLesson(+el.dataset.lesson); });
}
$('#lesson').addEventListener('click', e => { const t = e.target.closest('code.try'); if (t) { cmdEl.value = t.textContent.replace(/<.*?>/, ''); cmdEl.focus(); } });
$('#lClose').onclick = () => { lessonIdx = -1; $('#lesson').classList.add('hidden'); };
$('#lPrev').onclick = () => lessonIdx > 0 && showLesson(lessonIdx - 1);
$('#lNext').onclick = () => lessonIdx < LESSONS.length - 1 && showLesson(lessonIdx + 1);

/* =====================================================================
   11. WIRING & BOOT
   ===================================================================== */
$('#bLessons').onclick = openLessonMenu;
$('#bBreak').onclick = () => enqueue(breakIt);
$('#bExplain').onclick = () => enqueue(replay);
$('#bAdd').onclick = () => enqueue(addNode);
$('#bRm').onclick = () => {
  const n = [...S.nodes].reverse().find(x => !x.deleting);
  if (!n) return print('No nodes to remove.', 'err');
  enqueue(() => powerOff(n, true));
};
$('#bReset').onclick = () => { resetCluster(); print('— cluster reset —', 'info'); };
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
  SPEED = +b.dataset.s;
  document.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b));
});
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('#explain').classList.toggle('hidden', b.dataset.tab !== 'explain');
  $('#events').classList.toggle('hidden', b.dataset.tab !== 'events');
  if (b.dataset.tab === 'events') renderEvents();
});

resetCluster();
print('Welcome! This board is a live Kubernetes cluster with a real reconciliation loop.\nType "help", press Tab to autocomplete, or open 📘 Lessons.', 'info');
cmdEl.focus();
engineLoop();
</script>
