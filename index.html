<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K8s Circuit Board — Learn Kubernetes Visually</title>
<style>
/* =====================================================================
   STYLES
   ===================================================================== */
:root {
  /* Kubernetes palette: logo blue #326ce5 on deep navy */
  --bg:#060a17; --pcb:#0a1330; --panel:#0d1632; --panel2:#111d3f; --line:#1c2a52; --line2:#2a3d72;
  --k8s:#326ce5; --k8s2:#5b8def; --k8s3:#9bbcff; --glow:#326ce566;
  --txt:#e4ebff; --dim:#8a9bc4; --mute:#5a6a93;
  --green:#3ddc97; --blue:#4fc3ff; --amber:#ffb347; --red:#ff5d6c; --violet:#a78bfa;
  --ui:"Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono:"JetBrains Mono","Fira Code",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; color:var(--txt); font-family:var(--mono); display:flex; flex-direction:column; overflow:hidden;
  background:radial-gradient(1100px 500px at 15% -10%, #1a2c63 0%, transparent 60%), radial-gradient(900px 500px at 110% 110%, #14214a 0%, transparent 60%), var(--bg); }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:#24366b; border-radius:10px; border:2px solid transparent; background-clip:padding-box; }
::-webkit-scrollbar-track { background:transparent; }

/* header */
header { display:flex; align-items:center; gap:14px; padding:10px 18px; flex-wrap:wrap; font-family:var(--ui);
  background:linear-gradient(180deg,#101c40ee,#0a1229ee); border-bottom:1px solid var(--line); box-shadow:0 6px 24px #0009; position:relative; z-index:2; }
.brand { display:flex; align-items:center; gap:11px; margin-right:4px; }
.brand svg { width:36px; height:36px; filter:drop-shadow(0 0 8px var(--glow)); animation:spin 30s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.brand h1 { margin:0; font-size:16px; font-weight:700; letter-spacing:.3px; color:#fff; line-height:1.1; }
.brand h1 span { color:var(--k8s2); }
.brand small { display:block; font-size:10.5px; color:var(--dim); font-weight:500; }
.stats { display:flex; gap:6px; flex-wrap:wrap; }
.stat { display:flex; align-items:center; gap:7px; padding:5px 11px; border-radius:999px; background:#0b1430; border:1px solid var(--line); font-size:11.5px; color:var(--dim); white-space:nowrap; }
.stat b { color:#fff; font-family:var(--mono); font-weight:600; }
.stat i { width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 8px currentColor; }
.sep { flex:1; }
.grp { display:flex; gap:6px; align-items:center; }
.seg { display:flex; background:#0a1330; border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; }
.seg button { border:0; background:transparent; border-radius:999px; padding:5px 12px; }
.seg button:hover { background:#18264f; }
.seg button.on { background:var(--k8s); color:#fff; box-shadow:0 2px 10px var(--glow); }
.seg-label { font-size:10px; color:var(--mute); letter-spacing:1.3px; text-transform:uppercase; font-weight:700; margin-left:4px; }
button { font-family:var(--ui); font-size:12.5px; font-weight:500; color:var(--txt); background:#132049; border:1px solid var(--line2); border-radius:8px;
  padding:6px 12px; cursor:pointer; transition:background .15s, border-color .15s, box-shadow .15s, transform .05s; display:inline-flex; align-items:center; gap:6px; }
button:hover { background:#1a2b60; border-color:var(--k8s2); }
button:active { transform:translateY(1px); }
button:disabled { opacity:.4; cursor:default; }
button.primary { background:linear-gradient(180deg,#3d7af2,#2a5bd0); border-color:#4a82f0; color:#fff; box-shadow:0 2px 14px var(--glow); }
button.primary:hover { background:linear-gradient(180deg,#4b87ff,#326ce5); }
button.warn { background:linear-gradient(180deg,#3a1522,#280f18); border-color:#7a2c3a; color:#ffc7ce; }
button.warn:hover { border-color:var(--red); box-shadow:0 0 14px #ff5d6c44; }
button.ghost { background:transparent; border-color:transparent; color:var(--dim); }
button.ghost:hover { background:#16234a; color:#fff; border-color:var(--line2); }
button.on { background:var(--k8s); border-color:var(--k8s2); color:#fff; }

/* layout: cards */
main { flex:1; display:flex; gap:14px; padding:14px; min-height:0; }
.card { background:linear-gradient(180deg,#0f1938f2,#0b142ef2); border:1px solid var(--line); border-radius:var(--r); box-shadow:0 10px 30px #0007, inset 0 1px 0 #ffffff08; overflow:hidden; }
.card-head { display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); font-family:var(--ui); background:#0d1734; flex-wrap:wrap; }
.card-head .ttl { font-size:12.5px; font-weight:600; color:#fff; display:flex; align-items:center; gap:8px; }
.card-head .ttl small { color:var(--mute); font-weight:500; }
.live { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 #3ddc9788; animation:ping 1.8s infinite; }
@keyframes ping { 0% { box-shadow:0 0 0 0 #3ddc9788; } 80%,100% { box-shadow:0 0 0 8px #3ddc9700; } }
#boardCard { flex:1; display:flex; flex-direction:column; min-width:0; }
#boardWrap { flex:1; overflow:auto; background:var(--pcb); position:relative; }
#svg { width:100%; min-width:760px; display:block; }
aside { width:480px; display:flex; flex-direction:column; gap:14px; min-height:0; }
#panel { flex:1; display:flex; flex-direction:column; min-height:0; }
.legend { display:flex; flex-wrap:wrap; gap:12px; font-size:11px; color:var(--dim); margin-left:auto; font-family:var(--ui); }
.legend span { display:flex; align-items:center; gap:5px; }
.legend i { display:inline-block; width:8px; height:8px; border-radius:50%; box-shadow:0 0 8px currentColor; }

/* lesson card */
#lesson { padding:12px 14px; font-size:12px; line-height:1.55; max-height:42%; overflow:auto; font-family:var(--ui);
  background:linear-gradient(135deg,#17306e,#0f1d44); border-color:#2f4f9e; }
#lesson .lh { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
#lesson .lh b { color:#fff; flex:1; font-size:13px; }
#lesson .lh span { color:var(--k8s3); font-size:11px; background:#0b1a40; padding:2px 8px; border-radius:999px; }
#lesson button { padding:3px 10px; }
#lWhy { margin-top:10px; padding:10px; border:1px solid #2f6e5a; border-radius:8px; background:#0c2a2a; }
#lWhy b { color:var(--green); }
#lesson .lf { display:flex; gap:6px; justify-content:flex-end; margin-top:10px; }
code.try { font-family:var(--mono); color:#ffd08a; cursor:pointer; background:#0a1430; border:1px solid #2a3d72; padding:1px 6px; border-radius:5px; font-size:11.5px; display:inline-block; margin:2px 0; }
code.try:hover { background:#16245a; border-color:var(--k8s2); }

/* tabs */
#tabs { display:flex; background:#0a1330; border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; }
#tabs button { border:0; border-radius:999px; background:transparent; color:var(--dim); padding:5px 12px; font-size:12px; }
#tabs button.on { color:#fff; background:var(--k8s); box-shadow:0 2px 10px var(--glow); }
.pane { flex:1; overflow:auto; padding:12px 14px; min-height:0; font-size:12px; }
.hidden { display:none !important; }
#explainTitle { color:var(--k8s3); margin-bottom:10px; word-break:break-all; font-size:12px; padding:7px 10px; background:#0a1330; border-left:3px solid var(--k8s); border-radius:6px; }
#steps { list-style:none; counter-reset:s; padding:0; margin:0; line-height:1.5; font-family:var(--ui); font-size:12.5px; }
#steps li { counter-increment:s; position:relative; margin:0 0 6px; padding:7px 10px 7px 38px; color:#b8c6ea; border-radius:8px; border:1px solid transparent; transition:background .2s; }
#steps li::before { content:counter(s); position:absolute; left:9px; top:7px; width:20px; height:20px; border-radius:50%; background:#18264f; color:var(--dim);
  font:600 10px var(--mono); display:grid; place-items:center; }
#steps li.active { color:#fff; background:#16275a; border-color:#2f4f9e; box-shadow:0 0 18px #326ce522; }
#steps li.active::before { background:var(--k8s); color:#fff; box-shadow:0 0 10px var(--glow); }
#steps li.pending { color:#56658e; }
#steps code { font-family:var(--mono); color:#ffd08a; font-size:11.5px; }
#steps b { color:#fff; }
#events table { width:100%; border-collapse:collapse; font-size:11px; }
#events td, #events th { text-align:left; padding:5px 6px; border-bottom:1px solid #18244a; vertical-align:top; }
#events th { color:var(--dim); font:600 10.5px var(--ui); letter-spacing:.6px; position:sticky; top:0; background:#0d1734; }
#events tr:hover td { background:#111e44; }
#events tr.Warning td { color:#ffb0b8; }

/* terminal */
#term { height:42%; display:flex; flex-direction:column; background:#050915; }
.term-bar { display:flex; align-items:center; gap:10px; padding:8px 12px; background:#0c1530; border-bottom:1px solid var(--line); font:500 11.5px var(--ui); color:var(--dim); }
.dots { display:flex; gap:6px; } .dots i { width:11px; height:11px; border-radius:50%; display:block; }
.dots i:nth-child(1) { background:#ff5f57; } .dots i:nth-child(2) { background:#febc2e; } .dots i:nth-child(3) { background:#28c840; }
.term-bar .ctx { color:var(--k8s3); font-family:var(--mono); }
#out { flex:1; overflow:auto; padding:10px 12px; font-size:12px; white-space:pre-wrap; word-break:break-word; line-height:1.45; }
#out .in { color:var(--k8s3); } #out .err { color:#ff8592; } #out .info { color:#93a5d1; } #out .ok { color:var(--green); } #out .hint { color:var(--amber); }
#inRow { display:flex; border-top:1px solid var(--line); padding:9px 12px; align-items:center; background:#070d20; }
#inRow span { color:var(--k8s2); margin-right:8px; font-weight:700; }
#cmd { flex:1; background:transparent; border:0; outline:0; color:#fff; font:inherit; font-size:13px; caret-color:var(--k8s2); }
#cmd::placeholder { color:#3b4a75; }
#busy { color:var(--amber); font-size:11px; margin-left:auto; }

/* tooltip */
#tip { position:fixed; pointer-events:none; z-index:30; max-width:330px; background:#0b1430f2; backdrop-filter:blur(8px); border:1px solid var(--line2); border-radius:10px;
  padding:10px 12px; font:12px/1.5 var(--ui); box-shadow:0 10px 30px #000a, 0 0 0 1px #326ce522; }
#tip b { color:#fff; } #tip .st { color:#ffd08a; display:block; margin-top:6px; font-family:var(--mono); font-size:11px; padding-top:6px; border-top:1px solid var(--line); }

/* modal */
#modal { position:fixed; inset:0; background:#030712b3; backdrop-filter:blur(6px); z-index:20; display:flex; align-items:center; justify-content:center; padding:20px; }
#modal .card { width:min(780px,100%); max-height:90vh; display:flex; flex-direction:column; box-shadow:0 30px 80px #000c, 0 0 0 1px #326ce533; }
#modal .ch { display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); background:#0d1734; }
#modal .ch b { flex:1; color:#fff; font:600 14px var(--ui); }
#mBody { overflow:auto; padding:14px 16px; font:12.5px/1.55 var(--ui); }
#mBody h4 { margin:14px 0 6px; color:var(--k8s3); font:700 10.5px var(--ui); letter-spacing:1.4px; }
#mBody pre { background:#060b1c; border:1px solid var(--line); padding:10px; border-radius:8px; overflow:auto; margin:0; font:11.5px/1.45 var(--mono); color:#cdd8f7; }
#mBody a { color:var(--k8s3); cursor:pointer; text-decoration:none; border-bottom:1px dotted var(--k8s2); }
#mBody a:hover { color:#fff; }
#mBody textarea { width:100%; height:340px; background:#060b1c; color:#e0e8ff; border:1px solid var(--line2); border-radius:8px; font:12px/1.5 var(--mono); padding:10px; resize:vertical; outline:none; }
#mBody textarea:focus { border-color:var(--k8s2); box-shadow:0 0 0 3px #326ce533; }
#mBody select { background:#132049; color:var(--txt); border:1px solid var(--line2); border-radius:6px; font:inherit; padding:4px 8px; }
#mBody .lessonItem { padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; background:#0c1531; transition:all .15s; }
#mBody .lessonItem:hover { background:#14234f; border-color:var(--k8s2); transform:translateX(2px); }
#mFoot { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; background:#0b1430; }

/* svg board */
#svg text { font-family:var(--ui); }
.silk { fill:#3a5296; font-size:11px; letter-spacing:3px; font-weight:700; }
.trace { fill:none; stroke:#3d63c9; stroke-width:3; opacity:.42; stroke-linejoin:round; }
.trace.thin { stroke-width:1.5; opacity:.28; }
.ptrace { fill:none; stroke-width:4; opacity:.9; filter:url(#glow); stroke-linejoin:round; }
.ptrace.lite { stroke-width:1.5; opacity:.35; filter:none; }
.chip { cursor:pointer; }
.chip rect.body { fill:url(#chipGrad); stroke:#2a3d72; stroke-width:1.2; transition:stroke .2s; }
.chip:hover rect.body { stroke:var(--k8s2); }
.chip text { fill:#eef3ff; font-size:12px; font-weight:600; text-anchor:middle; pointer-events:none; }
.chip text.sub { fill:#7f91bd; font-size:8px; letter-spacing:1.3px; font-weight:600; }
.chip .pin { fill:#6f80ab; }
.hot rect.body, .hot > rect { stroke:#9bbcff !important; stroke-width:2.5 !important; filter:url(#glow); }
.node rect.frame { fill:url(#nodeGrad); stroke:#2b4384; stroke-width:1.5; cursor:pointer; }
.node rect.band { fill:#152650; pointer-events:none; }
.node.cordon rect.frame { stroke:var(--amber); stroke-dasharray:8 4; }
.node.down rect.frame { stroke:var(--red); stroke-dasharray:6 4; fill:#1c0f1c; }
.node.down rect.band { fill:#3a1525; }
.node.hot rect.frame { stroke:var(--red) !important; }
.node text { fill:#dbe5ff; font-size:12px; font-weight:600; pointer-events:none; }
.bar-bg { fill:#081026; stroke:#22346a; }
.slot { fill:#0b16351a; stroke:#22356b; stroke-dasharray:3 3; }
.pod { cursor:pointer; }
.pod text { font-size:9.5px; font-weight:600; text-anchor:middle; fill:#fff; pointer-events:none; }
.pod text.sub { fill:#ffffffa0; font-size:8.5px; font-weight:500; }
.pod:hover > rect { stroke-width:2.5; }
.led.ok { fill:var(--green); filter:url(#glow); }
.led.boot { fill:#ffd23f; filter:url(#glow); animation:blink .45s infinite alternate; }
.led.err { fill:#ff3b4f; filter:url(#glow); animation:blink .9s infinite alternate; }
.led.term { fill:#ff5d6c; animation:blink .25s infinite alternate; }
.led.idle { fill:#56628a; }
@keyframes blink { from { opacity:1; } to { opacity:.12; } }
.box > rect { fill:#0a1433d9; stroke:#2b4384; stroke-dasharray:4 3; }
.box text { fill:#9db4ea; font-size:10.5px; font-weight:700; letter-spacing:1.5px; }
.row { cursor:pointer; }
.row rect { fill:#111e44; stroke:#253a78; }
.row:hover rect { stroke:var(--k8s2); }
.row text { font-size:10.5px; fill:#d6e1ff; font-weight:500; pointer-events:none; }

/* responsive */
@media (max-width: 1100px) {
  main { flex-direction:column; overflow:auto; padding:10px; gap:10px; }
  #boardCard { flex:none; height:68vh; min-height:340px; }
  aside { width:100%; flex:none; }
  .pane { max-height:36vh; }
  #term { height:40vh; flex:none; }
  body { overflow:auto; }
  .stats { order:5; width:100%; }
}
@media (max-width: 640px) {
  header { padding:8px 10px; gap:8px; }
  .brand small, .legend { display:none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="k8s" viewBox="0 0 100 100">
    <polygon points="50,4 85.96,21.32 94.85,60.24 69.96,91.45 30.04,91.45 5.15,60.24 14.04,21.32" fill="#326ce5" stroke="#326ce5" stroke-width="7" stroke-linejoin="round"/>
    <g stroke="#fff" stroke-linecap="round" fill="none">
      <circle cx="50" cy="52" r="19" stroke-width="5"/>
      <path stroke-width="4.5" d="M50 52V19M50 52L76 31M50 52L82 59M50 52L64 81M50 52L36 81M50 52L18 59M50 52L24 31"/>
    </g>
    <circle cx="50" cy="52" r="6" fill="#fff"/>
  </symbol>
</svg>
<header>
  <div class="brand">
    <svg><use href="#k8s"/></svg>
    <div><h1>Kube<span>Circuit</span></h1><small>Learn Kubernetes by watching it think</small></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="sep"></div>
  <div class="grp">
    <button id="bLessons" class="primary">📘 Lessons</button>
    <button id="bExplain">⟲ Explain this</button>
    <button id="bBreak" class="warn">⚡ Break it</button>
  </div>
  <div class="grp">
    <span class="seg-label">Nodes</span>
    <div class="seg"><button id="bAdd" title="Add a worker node">＋</button><button id="bRm" title="Kill & remove the last worker node">－</button></div>
    <button id="bReset" class="ghost" title="Reset the cluster">↺ Reset</button>
  </div>
  <div class="grp">
    <span class="seg-label">Speed</span>
    <div class="seg"><button data-s="2.5">Slow</button><button data-s="1" class="on">Normal</button><button data-s="0.35">Fast</button></div>
  </div>
</header>
<main>
  <section id="boardCard" class="card">
    <div class="card-head">
      <div class="ttl"><span class="live"></span>Cluster topology <small>· click any component · hover for details</small></div>
      <div class="legend">
        <span><i style="color:#4fc3ff;background:#4fc3ff"></i>request</span>
        <span><i style="color:#ffb347;background:#ffb347"></i>etcd r/w</span>
        <span><i style="color:#a78bfa;background:#a78bfa"></i>watch</span>
        <span><i style="color:#3ddc97;background:#3ddc97"></i>status</span>
        <span><i style="color:#ff5d6c;background:#ff5d6c"></i>delete</span>
        <span><i style="color:#ffe66d;background:#ffe66d"></i>traffic</span>
      </div>
    </div>
    <div id="boardWrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M24 0 L0 0 0 24" fill="none" stroke="#111d42" stroke-width="1"/>
            <circle cx="0" cy="0" r="1.2" fill="#1f3270"/>
          </pattern>
          <linearGradient id="chipGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2856"/><stop offset="1" stop-color="#0d1533"/></linearGradient>
          <linearGradient id="nodeGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1c44"/><stop offset="1" stop-color="#0a1330"/></linearGradient>
          <radialGradient id="boardGlow" cx="50%" cy="0%" r="75%"><stop offset="0" stop-color="#326ce5" stop-opacity=".22"/><stop offset="1" stop-color="#326ce5" stop-opacity="0"/></radialGradient>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.6" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g id="board"></g>
        <g id="fx"></g>
      </svg>
    </div>
  </section>
  <aside>
    <div id="lesson" class="card hidden">
      <div class="lh"><b id="lTitle"></b><span id="lProg"></span><button id="lClose" class="ghost" title="Close lesson">✕</button></div>
      <div id="lTask"></div>
      <div id="lWhy" class="hidden"></div>
      <div class="lf"><button id="lPrev">‹ Prev</button><button id="lNext" class="primary">Next ›</button></div>
    </div>
    <section id="panel" class="card">
      <div class="card-head"><div id="tabs"><button data-tab="explain" class="on">What just happened</button><button data-tab="events">Events</button></div></div>
      <div id="explain" class="pane">
        <div id="explainTitle">Type a command below — try <b>help</b>, or open 📘 Lessons.</div>
        <ol id="steps"></ol>
      </div>
      <div id="events" class="pane hidden"></div>
    </section>
    <section id="term" class="card">
      <div class="term-bar"><span class="dots"><i></i><i></i><i></i></span><span>kubectl</span><span class="ctx">ctx: kube-circuit · ns: default</span><span id="busy"></span></div>
      <div id="out"></div>
      <div id="inRow"><span>❯</span><input id="cmd" autocomplete="off" spellcheck="false" placeholder="kubectl create deployment web --image=nginx --replicas=3"></div>
    </section>
  </aside>
</main>
<div id="tip" class="hidden"></div>
<div id="modal" class="hidden"><div class="card"><div class="ch"><b id="mTitle"></b><button id="mClose">✕</button></div><div id="mBody"></div><div id="mFoot"></div></div></div>

<script>
'use strict';
/* =====================================================================
   1. CONSTANTS & HELPERS
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const C = { req:'#4fc3ff', write:'#ffb347', watch:'#a78bfa', ok:'#3ddc97', del:'#ff5d6c', traffic:'#ffe66d', beat:'#5b8def' };
const W = 1200, BUS_Y = 338;
const NODE_CPU = 2000, NODE_MEM = 4096, DEF_CPU = 250, DEF_MEM = 256, MAX_NODES = 9, NODE_SLOTS = 12;
const K8S_VERSION = 'v1.30.2';
const REV_COLORS = ['#4fc3ff','#ff9f43','#a78bfa','#3ddc97','#ff6bcb','#ffe66d','#6be4ff'];
// Images matching this pattern "don't exist in the registry" -> ErrImagePull / ImagePullBackOff.
const BAD_IMAGE = /ngnix|nignx|nginxx|doesnotexist|does-not-exist|nonexistent|invalid|typo|:latst|:lastest/i;
const DNS1123 = /^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/;
const IMAGE_RE = /^[a-z0-9][a-z0-9._\-\/]*(:[A-Za-z0-9._\-]+)?$/;

let SPEED = 1;
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const now = () => Date.now();
const clone = o => JSON.parse(JSON.stringify(o));
const rand = (n, al = 'bcdfghjklmnpqrstvwxz2456789') => Array.from({ length:n }, () => al[Math.floor(Math.random() * al.length)]).join('');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const iso = t => new Date(t).toISOString().replace(/\.\d+Z$/, 'Z');
const selStr = sel => Object.entries(sel).map(([k, v]) => `${k}=${v}`).join(',');
const matches = (sel, labels) => Object.keys(sel).length > 0 && Object.entries(sel).every(([k, v]) => labels[k] === v);
const imageOK = img => !BAD_IMAGE.test(img);
const imageBase = img => img.split('/').pop().split(':')[0].split('@')[0];

function age(t) {
  const s = Math.max(0, Math.floor((now() - t) / 1000));
  if (s < 120) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 10) return `${m}m${s % 60}s`;

}
function hashStr(s) {

const parseCPU = v => v == null ? DEF_CPU : String(v).endsWith('m') ? parseInt(v, 10) : Math.round(parseFloat(v) * 1000);
function parseMem(v) {
  if (v == null) return DEF_MEM;
  const m = String(v).match(/^([\d.]+)\s*(Ki|Mi|Gi|K|M|G)?$/);
  if (!m) return NaN;
  const n = +m[1], f = { Ki:1 / 1024, Mi:1, Gi:1024, K:1 / 1048.576, M:1 / 1.048576, G:953.674 }[m[2]];

}
function levenshtein(a, b) {
  const d = Array.from({ length:a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}

/* =====================================================================
   2. CLUSTER STATE (the "etcd" of this simulator)
   ===================================================================== */
let S = null;
function freshState() {
  return {
    epoch: (S ? S.epoch : 0) + 1, t0: now(),
    nodes: [], pods: [], deployments: [], replicasets: [], services: [], events: [],
    nodeSeq: 0, lastBindings: [], history: [],
    stats: { deletedFrom: new Set(), curl: {}, undo: 0, nodeFailed: 0, sawBackoff: new Set(), drained: 0 },
  };
}
function makeNode() {
  const i = ++S.nodeSeq;
  return { kind:'Node', name:'node-' + i, idx:i, ip:'192.168.49.' + (10 + i), cpu:NODE_CPU, mem:NODE_MEM, ready:true, unschedulable:false,
           created:now(), downSince:0, notReadyMarked:false, deleting:false, ipNext:2 };
}
function makePod({ name, labels, image, container, cpu = DEF_CPU, mem = DEF_MEM, owner = null }) {
  return { kind:'Pod', name, uid:rand(8) + '-' + rand(4), labels:{ ...labels }, image, container, cpu, mem, owner,
           nodeName:null, state:'Pending', ready:false, terminating:false, created:now(), restarts:0, ip:null, logs:[],
           schedSig:null, schedMsg:null, startTime:null, bootUntil:0, cid:rand(12, '0123456789abcdef') };
}
function makeDeployment({ name, image, replicas, container, cpu = DEF_CPU, mem = DEF_MEM, labels }) {
  const lbl = labels || { app:name };
  return { kind:'Deployment', name, replicas, selector:{ ...lbl }, created:now(), revision:0, rolling:false,
           template:{ labels:{ ...lbl }, container:container || imageBase(image), image, cpu, mem } };
}
const tplHash = t => hashStr(JSON.stringify([t.image, t.container, t.cpu, t.mem, t.labels]));
const findNode = n => S.nodes.find(x => x.name === n);
const findPod = n => S.pods.find(x => x.name === n);
const findDep = n => S.deployments.find(x => x.name === n);
const findRS = n => S.replicasets.find(x => x.name === n);
const findSvc = n => S.services.find(x => x.name === n);
const live = p => !p.terminating;
const rsOfDep = d => S.replicasets.filter(r => r.owner === d.name);
const podsOfRS = rs => S.pods.filter(p => p.owner === rs.name);
const readyCount = rs => podsOfRS(rs).filter(p => p.ready && live(p)).length;
const depOfPod = p => { const rs = p.owner && findRS(p.owner); return rs ? findDep(rs.owner) : null; };
const podStatus = p => p.terminating ? 'Terminating' : p.state;
const pendingPods = () => S.pods.filter(p => !p.nodeName && live(p));
function nodeAlloc(n) {
  let cpu = 0, mem = 0, count = 0;
  for (const p of S.pods) if (p.nodeName === n.name && live(p)) { cpu += p.cpu; mem += p.mem; count++; }
  return { cpu, mem, count };
}
function depStatus(d) {
  const rss = rsOfDep(d), newRS = rss.find(r => r.hash === tplHash(d.template));
  const pods = rss.flatMap(podsOfRS).filter(live);
  const newPods = newRS ? podsOfRS(newRS).filter(live) : [];
  return { newRS, total:pods.length, ready:pods.filter(p => p.ready).length, updated:newPods.length, newReady:newPods.filter(p => p.ready).length };
}
function nodeStatusStr(n) { return (n.notReadyMarked ? 'NotReady' : 'Ready') + (n.unschedulable ? ',SchedulingDisabled' : ''); }

/** Append a Kubernetes-style event (deduplicated with a count, like the real thing). */
function ev(type, reason, obj, msg, from) {
  const e = S.events.find(x => x.obj === obj && x.reason === reason && x.msg === msg);
  if (e) { e.count++; e.time = now(); }
  else S.events.push({ type, reason, obj, msg, from, time:now(), first:now(), count:1 });
  if (S.events.length > 400) S.events.shift();
}

/* =====================================================================
   3. NARRATION & ANIMATION PRIMITIVES
   step(): the single primitive used by both commands and controllers.
   It narrates a sentence, animates the hops, then applies the state change.
   ===================================================================== */
let trace = null, lastTrace = null, replaying = false;
const flashing = new Map();

function beginTrace(title) {
  trace = { title, steps:[] }; lastTrace = trace;
  $('#explainTitle').textContent = title;
  $('#steps').innerHTML = '';
}
function addStepLi(text, cls = 'active') {
  const ol = $('#steps'), li = document.createElement('li');
  li.innerHTML = text; li.className = cls; ol.appendChild(li);
  while (ol.children.length > 80) ol.removeChild(ol.firstChild);
  li.scrollIntoView({ block:'nearest' });
  return li;
}
/** hops: array of [from,to,color] (sequential) or arrays of those (parallel group). */
async function runHops(hops) {
  for (const h of hops) {
    if (Array.isArray(h[0])) await Promise.all(h.map(x => pulse(...x)));
    else await pulse(...h);
  }
}
async function step(text, hops = [], act) {
  const epoch = S.epoch;
  let li = null;
  if (!replaying) {
    if (!trace) beginTrace('Cluster activity (reconciliation loop)');
    trace.steps.push({ text, hops });
    li = addStepLi(text);
  }
  await runHops(hops);
  if (S.epoch !== epoch) throw new Error('reset');
  if (act) act();
  if (li) li.className = '';
  scheduleRender();
}

function hotOn(id, ms) {
  flashing.set(id, now() + ms);
  const el = document.querySelector(`#board [data-id="${id}"]`);
  if (el) el.classList.add('hot');
  setTimeout(() => {
    if ((flashing.get(id) || 0) <= now()) { flashing.delete(id); const e = document.querySelector(`#board [data-id="${id}"]`); if (e) e.classList.remove('hot'); }
  }, ms + 20);
}
const isHot = id => (flashing.get(id) || 0) > now() ? ' hot' : '';

function pulse(from, to, color, lite) {
  return new Promise(res => {
    const a = anchor(from), b = anchor(to);
    // requestAnimationFrame is paused in background tabs; skip the animation so the engine keeps running.
    if (!a || !b || document.hidden) return lite ? res() : setTimeout(res, 60);
    const fx = $('#fx');
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', routeD(a, b)); p.setAttribute('class', lite ? 'ptrace lite' : 'ptrace'); p.style.stroke = color;
    fx.appendChild(p);
    const L = p.getTotalLength() || 1;
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', lite ? 3 : 6.5); c.setAttribute('fill', color);
    if (!lite) c.setAttribute('filter', 'url(#glow)');
    fx.appendChild(c);
    if (!lite) hotOn(from, 450);
    const dur = (lite ? 1100 : 560) * (replaying ? 3 : SPEED) * (0.65 + Math.min(L, 900) / 900 * 0.6);
    const t0 = performance.now();
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      c.remove();
      if (!lite) hotOn(to, 650);
      p.style.transition = 'opacity .5s'; p.style.opacity = 0;
      setTimeout(() => p.remove(), 520);
      res();
    };
    const f = t => {
      if (done) return;
      const k = Math.max(0, Math.min(1, (t - t0) / dur)), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const pt = p.getPointAtLength(e * L);
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
      p.style.strokeDashoffset = L * (1 - e);
      if (k < 1) requestAnimationFrame(f); else finish();
    };
    requestAnimationFrame(f);
    setTimeout(finish, dur + 400);
  });
}

function sparks(x, y, big) {
  const fx = $('#fx'), g = document.createElementNS(NS, 'g'); fx.appendChild(g);
  const parts = [];
  for (let i = 0; i < (big ? 28 : 14); i++) {
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('stroke', i % 3 ? '#ffb347' : '#ff5d6c'); l.setAttribute('stroke-width', 2); l.setAttribute('stroke-linecap', 'round');
    g.appendChild(l);
    parts.push({ l, ang:Math.random() * Math.PI * 2, sp:(big ? 110 : 48) * (0.5 + Math.random()) });
  }
  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('cx', x); ring.setAttribute('cy', y); ring.setAttribute('fill', '#ff5d6c33'); ring.setAttribute('stroke', '#ff5d6c'); ring.setAttribute('stroke-width', 3);
  g.appendChild(ring);
  const t0 = performance.now(), D = 700;
  const f = t => {
    const k = Math.max(0, Math.min(1, (t - t0) / D));
    for (const s of parts) {
      const d1 = s.sp * k, d0 = Math.max(0, d1 - 14), drop = k * k * 25;
      s.l.setAttribute('x1', x + Math.cos(s.ang) * d0); s.l.setAttribute('y1', y + Math.sin(s.ang) * d0 + drop);
      s.l.setAttribute('x2', x + Math.cos(s.ang) * d1); s.l.setAttribute('y2', y + Math.sin(s.ang) * d1 + drop);
    }
    ring.setAttribute('r', (big ? 90 : 32) * k);
    g.setAttribute('opacity', 1 - k);
    if (k < 1) requestAnimationFrame(f); else g.remove();
  };
  requestAnimationFrame(f);
  setTimeout(() => g.remove(), D + 500);
}

/** Remove pods from the store (optionally with a spark burst where they were drawn). */
function removePods(pods, withSparks) {
  for (const p of pods) { const a = anchor('pod:' + p.name); if (withSparks && a) sparks(a.x, a.y); }
  S.pods = S.pods.filter(p => !pods.includes(p));
}
/** API-level delete: graceful (Terminating) if a live kubelet owns it, else immediate. */
function markDelete(p) {
  const n = p.nodeName && findNode(p.nodeName);
  if (!n || !n.ready) removePods([p], !!n);
  else { p.terminating = true; p.ready = false; p.delAt = now(); }
}

/* =====================================================================
   4. RECONCILIATION ENGINE (controllers)
   Runs forever. Each pass lets every controller compare desired vs actual
   state and take at most a few actions. Commands never do this work.
   ===================================================================== */
async function reconcile() {
  // Every controller gets a turn each pass (like independent goroutines in the real controller-manager).
  let did = false;
  for (const c of [deploymentController, replicaSetController, garbageCollector, scheduler, kubelets, nodeController, endpointsController])
    if (await c()) did = true;
  return did;
}
async function engineLoop() {
  let lastBeat = 0;
  for (;;) {
    let did = false;
    try { did = await reconcile(); } catch (e) { if (e.message !== 'reset') console.error(e); }
    if (!did && now() - lastBeat > 4500) { lastBeat = now(); heartbeat(); }
    checkLesson();
    await sleep(did ? 90 * SPEED : 250);
  }
}
function heartbeat() {
  for (const n of S.nodes) if (n.ready) pulse('kubelet:' + n.name, 'api', C.beat, true);
}

// --- Deployment controller: owns ReplicaSets, performs rolling updates ---
async function deploymentController() {
  const H = [['api','cm',C.watch],['cm','api',C.req]];
  for (const d of [...S.deployments]) {
    const hash = tplHash(d.template), rss = rsOfDep(d);
    const nrs = rss.find(r => r.hash === hash);
    if (!nrs) {
      const maxRev = Math.max(0, ...rss.map(r => r.revision));
      const first = !rss.some(r => r.replicas > 0);
      const name = `${d.name}-${hash}`;
      await step(first
        ? `<b>Deployment controller</b> sees new Deployment <b>${d.name}</b> → creates ReplicaSet <b>${name}</b> with ${d.replicas} replica(s). (Deployment → ReplicaSet → Pods)`
        : `<b>Deployment controller</b>: the pod template of <b>${d.name}</b> changed (image <code>${esc(d.template.image)}</code>) → creates a <b>new ReplicaSet</b> ${name} (revision ${maxRev + 1}). Rolling update starts: maxSurge=1, maxUnavailable=0.`,
        [...H, ['api','etcd',C.write]], () => {
          if (!S.deployments.includes(d)) return;
          S.replicasets.push({ kind:'ReplicaSet', name, owner:d.name, hash, template:clone(d.template), selector:{ ...d.selector, 'pod-template-hash':hash },
                               replicas:first ? d.replicas : 0, revision:maxRev + 1, created:now() });
          d.revision = maxRev + 1;
          ev('Normal', 'ScalingReplicaSet', 'deployment/' + d.name, `Scaled up replica set ${name} to ${first ? d.replicas : 0}`, 'deployment-controller');
        });
      return true;
    }
    const olds = rss.filter(r => r !== nrs && r.replicas > 0);
    const scale = async (rs, to, why) => {
      const from = rs.replicas;
      await step(why, H, () => {
        rs.replicas = to;
        ev('Normal', 'ScalingReplicaSet', 'deployment/' + d.name, `Scaled ${to > from ? 'up' : 'down'} replica set ${rs.name} from ${from} to ${to}`, 'deployment-controller');
      });
      return true;
    };
    if (!olds.length) {
      if (nrs.replicas !== d.replicas)
        return scale(nrs, d.replicas, `<b>Deployment controller</b>: ${d.name} wants <b>${d.replicas}</b> replicas → sets ReplicaSet ${nrs.name}.spec.replicas ${nrs.replicas} → ${d.replicas}.`);
      if (d.rolling && depStatus(d).newReady >= d.replicas) {
        await step(`✅ Rollout of <b>${d.name}</b> complete: every pod runs revision ${nrs.revision}. Old ReplicaSets are kept at 0 replicas so you can <code>rollout undo</code>.`, [['cm','api',C.ok]], () => d.rolling = false);
        return true;
      }
      continue;
    }
    // Rolling update in progress (maxSurge = 1, maxUnavailable = 0).
    // Pods above an RS's spec are about to be deleted, so they don't count as available.
    d.rolling = true;
    const avail = r => Math.min(r.replicas, readyCount(r));
    const total = nrs.replicas + olds.reduce((a, r) => a + r.replicas, 0);
    const newReady = avail(nrs), oldReady = olds.reduce((a, r) => a + avail(r), 0);
    if (nrs.replicas > d.replicas) return scale(nrs, d.replicas, `Deployment controller trims new ReplicaSet ${nrs.name} to ${d.replicas}.`);
    if (nrs.replicas < d.replicas && total < d.replicas + 1)
      return scale(nrs, nrs.replicas + 1, `🔄 Rolling update: scale <b>up</b> new ReplicaSet <b>${nrs.name}</b> → ${nrs.replicas + 1} (allowed to exceed ${d.replicas} by maxSurge=1).`);
    const unhealthyOld = olds.find(r => r.replicas > readyCount(r));
    if (unhealthyOld)
      return scale(unhealthyOld, readyCount(unhealthyOld), `Rolling update: old ReplicaSet ${unhealthyOld.name} has unready pods → scales them away first (they serve no traffic anyway).`);
    if (newReady + oldReady > d.replicas) {
      const r = olds.sort((a, b) => a.revision - b.revision)[0];
      return scale(r, r.replicas - 1, `🔄 Rolling update: a new pod is <b>Ready</b>, so availability allows scaling <b>down</b> old ReplicaSet <b>${r.name}</b> → ${r.replicas - 1}.`);
    }
  }
  return false;
}

// --- ReplicaSet controller: keeps N pods matching the template alive ---
function pickVictims(pods, n) {
  const rank = p => !p.nodeName ? 0 : !p.ready ? 1 : 2;
  return [...pods].sort((a, b) => rank(a) - rank(b) || b.created - a.created).slice(0, n);
}
async function replicaSetController() {
  for (const rs of [...S.replicasets]) {
    const pods = podsOfRS(rs).filter(live), diff = rs.replicas - pods.length;
    if (diff > 0) {
      const created = Array.from({ length:diff }, () => makePod({ name:`${rs.name}-${rand(5)}`, labels:{ ...rs.template.labels, 'pod-template-hash':rs.hash },
        image:rs.template.image, container:rs.template.container, cpu:rs.template.cpu, mem:rs.template.mem, owner:rs.name }));
      await step(`<b>ReplicaSet controller</b>: ${rs.name} wants <b>${rs.replicas}</b>, sees ${pods.length} → creates ${diff} Pod object(s). No node assigned yet → <b>Pending</b>.`,
        [['api','cm',C.watch],['cm','api',C.req],['api','etcd',C.write]], () => {
          if (!S.replicasets.includes(rs)) return;
          S.pods.push(...created);
          created.forEach(p => ev('Normal', 'SuccessfulCreate', 'replicaset/' + rs.name, 'Created pod: ' + p.name, 'replicaset-controller'));
        });
      return true;
    }
    if (diff < 0) {
      const victims = pickVictims(pods, -diff);
      await step(`<b>ReplicaSet controller</b>: ${rs.name} has ${pods.length}, wants ${rs.replicas} → deletes ${-diff} pod(s) (unscheduled → unready → newest first).`,
        [['api','cm',C.watch],['cm','api',C.del]], () => victims.forEach(p => {
          if (!S.pods.includes(p)) return;
          markDelete(p);
          ev('Normal', 'SuccessfulDelete', 'replicaset/' + rs.name, 'Deleted pod: ' + p.name, 'replicaset-controller');
        }));
      return true;
    }
  }
  return false;
}

// --- Garbage collector: cascading deletes via ownerReferences ---
async function garbageCollector() {
  const orphanRS = S.replicasets.filter(r => !findDep(r.owner));
  if (orphanRS.length) {
    await step(`<b>Garbage collector</b>: ReplicaSet(s) ${orphanRS.map(r => r.name).join(', ')} lost their owner Deployment → <b>cascading delete</b> of them and their pods.`,
      [['api','cm',C.watch],['cm','api',C.del],['api','etcd',C.del]], () => {
        S.replicasets = S.replicasets.filter(r => !orphanRS.includes(r));
        S.pods.filter(p => orphanRS.some(r => r.name === p.owner) && live(p)).forEach(markDelete);
      });
    return true;
  }
  const orphanPods = S.pods.filter(p => p.owner && !findRS(p.owner) && live(p));
  if (orphanPods.length) {
    await step(`<b>Garbage collector</b>: pods whose ReplicaSet is gone are deleted.`, [['cm','api',C.del]], () => orphanPods.forEach(markDelete));
    return true;
  }
  return false;
}

// --- Scheduler: filter + score, then bind ---
function schedSignature() { return JSON.stringify(S.nodes.map(n => { const a = nodeAlloc(n); return [n.name, n.ready, n.unschedulable, a.cpu, a.mem]; })); }
function pickNodeFor(p, extra) {
  if (!S.nodes.length) return { msg:'no nodes available to schedule pods' };
  const reasons = {}, inc = r => reasons[r] = (reasons[r] || 0) + 1, ok = [];
  for (const n of S.nodes) {
    if (!n.ready) { inc('node(s) had untolerated taint {node.kubernetes.io/unreachable: }'); continue; }
    if (n.unschedulable) { inc('node(s) were unschedulable'); continue; }
    const a = nodeAlloc(n), e = extra[n.name] || { cpu:0, mem:0 };
    const cpuFree = n.cpu - a.cpu - e.cpu, memFree = n.mem - a.mem - e.mem;
    if (p.cpu > cpuFree) { inc('Insufficient cpu'); continue; }
    if (p.mem > memFree) { inc('Insufficient memory'); continue; }
    ok.push({ n, score:(cpuFree - p.cpu) / n.cpu + (memFree - p.mem) / n.mem });
  }
  if (!ok.length) {
    const N = S.nodes.length;
    return { msg:`0/${N} nodes are available: ${Object.entries(reasons).map(([r, c]) => c + ' ' + r).join(', ')}. preemption: 0/${N} nodes are available: ${N} Preemption is not helpful for scheduling.` };
  }
  ok.sort((a, b) => b.score - a.score);
  return { node:ok[0].n };
}
async function scheduler() {
  const sig = schedSignature();
  const todo = S.pods.filter(p => !p.nodeName && live(p) && p.schedSig !== sig);
  if (!todo.length) return false;
  await step(`<b>Scheduler</b> (watching for pods with empty <code>spec.nodeName</code>) receives ${todo.length} pod(s).`, [['api','sched',C.watch]]);
  const plan = [], fails = [], extra = {};
  for (const p of todo) {
    if (!S.pods.includes(p) || p.nodeName) continue;
    const r = pickNodeFor(p, extra);
    if (r.node) { plan.push([p, r.node]); const e = extra[r.node.name] = extra[r.node.name] || { cpu:0, mem:0 }; e.cpu += p.cpu; e.mem += p.mem; }
    else fails.push([p, r.msg]);
  }
  if (plan.length)
    await step(`Scheduler <b>filters</b> nodes (Ready? schedulable? enough free CPU/memory for the requests?), <b>scores</b> the survivors (most free resources wins) and POSTs a <b>Binding</b>: ${plan.map(([p, n]) => `${p.name} → <b>${n.name}</b>`).join(', ')}.`,
      [['sched','api',C.req],['api','etcd',C.write]], () => plan.forEach(([p, n]) => {
        if (!S.pods.includes(p) || p.nodeName || !S.nodes.includes(n)) return;
        p.nodeName = n.name; p.schedMsg = null;
        S.lastBindings.unshift(`${p.name} → ${n.name}`); S.lastBindings.length = Math.min(S.lastBindings.length, 10);
        ev('Normal', 'Scheduled', 'pod/' + p.name, `Successfully assigned default/${p.name} to ${n.name}`, 'default-scheduler');
      }));
  if (fails.length)
    await step(`⚠️ Scheduler can't place ${fails.length} pod(s) → they stay <b>Pending</b>. Reason: <i>${esc(fails[0][1])}</i> It will retry when the cluster changes.`,
      [['sched','api',C.del]], () => fails.forEach(([p, m]) => { p.schedMsg = m; ev('Warning', 'FailedScheduling', 'pod/' + p.name, m, 'default-scheduler'); }));
  const sig2 = schedSignature();
  todo.forEach(p => { if (!p.nodeName) p.schedSig = sig2; });
  return true;
}

// --- kubelet (one per node) + container runtime ---
function genLogs(p) {
  const ts = new Date().toISOString(), b = imageBase(p.image);
  if (b === 'nginx') return [
    '/docker-entrypoint.sh: /docker-entrypoint.d/ is not empty, will attempt to perform configuration',
    '/docker-entrypoint.sh: Launching /docker-entrypoint.d/10-listen-on-ipv6-by-default.sh',
    '10-listen-on-ipv6-by-default.sh: info: Enabled listen on IPv6 in /etc/nginx/conf.d/default.conf',
    '/docker-entrypoint.sh: Configuration complete; ready for start up',
    `${ts.slice(0, 10).replace(/-/g, '/')} ${ts.slice(11, 19)} [notice] 1#1: using the "epoll" event method`,
    `${ts.slice(0, 10).replace(/-/g, '/')} ${ts.slice(11, 19)} [notice] 1#1: nginx/${/^\d/.test(imageTag(p.image)) ? imageTag(p.image) : '1.27.0'}`,
    `${ts.slice(0, 10).replace(/-/g, '/')} ${ts.slice(11, 19)} [notice] 1#1: start worker processes`];
  if (b === 'redis') return [`1:C ${ts} * oO0OoO0OoO0Oo Redis is starting oO0OoO0OoO0Oo`, `1:M ${ts} * Running mode=standalone, port=6379.`, `1:M ${ts} * Server initialized`, `1:M ${ts} * Ready to accept connections tcp`];
  if (b === 'httpd') return [`AH00558: httpd: Could not reliably determine the server's fully qualified domain name, using ${p.ip}.`, `[mpm_event:notice] [pid 1:tid 1] AH00489: Apache/2.4.59 (Unix) configured -- resuming normal operations`];
  if (b === 'busybox' || b === 'alpine') return ['/ # (container running sleep 3600)'];
  return [`${ts} INFO  Starting ${b} (pid 1)`, `${ts} INFO  Loaded configuration from env`, `${ts} INFO  Listening on 0.0.0.0:8080`, `${ts} INFO  Ready`];
}
// Every node's kubelet runs independently, so they act in parallel.
async function kubelets() {
  const results = await Promise.all(S.nodes.filter(n => n.ready).map(kubeletSync));
  return results.some(Boolean);
}
async function kubeletSync(n) {
  let did = false;
  {
    const K = 'kubelet:' + n.name, RT = 'rt:' + n.name, mine = () => S.pods.filter(p => p.nodeName === n.name);
    const names = ps => ps.map(p => `<b>${p.name}</b>`).join(', ');
    const fresh = mine().filter(p => p.state === 'Pending' && live(p));
    if (fresh.length) {
      await step(`<b>kubelet@${n.name}</b> sees ${names(fresh)} bound to its node → calls <b>containerd</b> over CRI: create pod sandbox + network, pull image, start container. LED blinks <span style="color:#ffd23f">yellow</span> while booting.`,
        [['api',K,C.watch],[K,RT,C.req]], () => fresh.forEach(p => {
          if (!S.pods.includes(p) || p.terminating) return;
          p.state = 'ContainerCreating'; p.ip = `10.244.${n.idx}.${n.ipNext++}`;
          p.bootUntil = now() + (1400 + Math.random() * 1200) * SPEED;
          ev('Normal', 'Pulling', 'pod/' + p.name, `Pulling image "${p.image}"`, 'kubelet');
        }));
      did = true;
    }
    const booted = mine().filter(p => p.state === 'ContainerCreating' && live(p) && now() >= p.bootUntil);
    const good = booted.filter(p => imageOK(p.image)), bad = booted.filter(p => !imageOK(p.image));
    if (good.length) {
      await step(`containerd started ${names(good)}. Readiness check passes → kubelet PATCHes pod status <b>Running / Ready</b> to the API server (LED turns <span style="color:#3ddc97">green</span>).`,
        [good.map(p => [RT, 'pod:' + p.name, C.ok]), [K,'api',C.ok], ['api','etcd',C.write]], () => good.forEach(p => {
          if (!S.pods.includes(p) || p.terminating) return;
          p.state = 'Running'; p.ready = true; p.startTime = now(); p.logs = genLogs(p);
          ev('Normal', 'Pulled', 'pod/' + p.name, `Successfully pulled image "${p.image}" in ${(0.8 + Math.random() * 3).toFixed(3)}s`, 'kubelet');
          ev('Normal', 'Created', 'pod/' + p.name, `Created container ${p.container}`, 'kubelet');
          ev('Normal', 'Started', 'pod/' + p.name, `Started container ${p.container}`, 'kubelet');
        }));
      did = true;
    }
    if (bad.length) {
      await step(`❌ containerd <b>failed to pull</b> image <code>${esc(bad[0].image)}</code> (repository not found / no pull access) → <b>ErrImagePull</b>, then <b>ImagePullBackOff</b>: kubelet retries with exponential back-off. The pod never becomes Ready.`,
        [[RT,K,C.del],[K,'api',C.del]], () => bad.forEach(p => {
          if (!S.pods.includes(p) || p.terminating) return;
          p.state = 'ImagePullBackOff';
          const ref = p.image.includes('/') ? p.image : `docker.io/library/${p.image}${p.image.includes(':') ? '' : ':latest'}`;
          ev('Warning', 'Failed', 'pod/' + p.name, `Failed to pull image "${p.image}": rpc error: code = NotFound desc = failed to pull and unpack image "${ref}": failed to resolve reference "${ref}": ${ref}: not found`, 'kubelet');
          ev('Warning', 'Failed', 'pod/' + p.name, 'Error: ErrImagePull', 'kubelet');
          ev('Normal', 'BackOff', 'pod/' + p.name, `Back-off pulling image "${p.image}"`, 'kubelet');
          ev('Warning', 'Failed', 'pod/' + p.name, 'Error: ImagePullBackOff', 'kubelet');
          const d = depOfPod(p); if (d) S.stats.sawBackoff.add(d.name);
        }));
      did = true;
    }
    const dying = mine().filter(p => p.terminating);
    if (dying.length) {
      await step(`<b>kubelet@${n.name}</b> sees ${names(dying)} marked for deletion → containerd sends SIGTERM, waits the grace period, then SIGKILL. 💥 Pod removed.`,
        [['api',K,C.watch],[K,RT,C.del]], () => {
          const still = dying.filter(p => S.pods.includes(p));
          still.forEach(p => ev('Normal', 'Killing', 'pod/' + p.name, `Stopping container ${p.container}`, 'kubelet'));
          removePods(still, true);
        });
      did = true;
    }
  }
  return did && S.nodes.includes(n);
}

// --- Node lifecycle controller + PodGC ---
async function nodeController() {
  for (const n of [...S.nodes]) {
    if (n.ready) continue;
    if (!n.notReadyMarked && now() - n.downSince > 1800 * SPEED) {
      await step(`<b>Node lifecycle controller</b>: no heartbeat (Lease renewal) from <b>${n.name}</b> for too long (real default: 40s) → marks it <b>NotReady</b> and taints it <code>node.kubernetes.io/unreachable:NoExecute</code>.`,
        [['api','cm',C.watch],['cm','api',C.del],['api','etcd',C.write]], () => {
          n.notReadyMarked = true;
          ev('Normal', 'NodeNotReady', 'node/' + n.name, `Node ${n.name} status is now: NodeNotReady`, 'node-controller');
        });
      return true;
    }
    if (n.notReadyMarked && now() - n.downSince > 4000 * SPEED) {
      const pods = S.pods.filter(p => p.nodeName === n.name);
      if (pods.length) {
        const bare = pods.filter(p => !p.owner);
        await step(`Pods on <b>${n.name}</b> exceeded their <code>unreachable</code> toleration (real default: 300s) → <b>evicted</b>. ${bare.length ? `Bare pod(s) ${bare.map(p => p.name).join(', ')} are <b>gone for good</b> — no controller owns them. ` : ''}${pods.length > bare.length ? 'Their ReplicaSets will notice and create replacements on healthy nodes.' : ''}`,
          [['cm','api',C.del],['api','etcd',C.del]], () => {
            const still = pods.filter(p => S.pods.includes(p));
            still.forEach(p => ev('Normal', 'TaintManagerEviction', 'pod/' + p.name, `Marking for deletion Pod default/${p.name}`, 'taint-eviction-controller'));
            removePods(still, true);
          });
        return true;
      }
      if (n.deleting) {
        await step(`Node object <b>${n.name}</b> is deleted from the cluster.`, [['api','etcd',C.del]], () => {
          S.nodes = S.nodes.filter(x => x !== n);
          ev('Normal', 'RemovingNode', 'node/' + n.name, `Node ${n.name} event: Removing Node ${n.name} from Controller`, 'node-controller');
        });
        return true;
      }
    }
  }
  const lost = S.pods.filter(p => p.nodeName && !findNode(p.nodeName));
  if (lost.length) {
    await step('<b>PodGC</b>: pods bound to a node that no longer exists are deleted.', [['api','cm',C.watch],['cm','api',C.del]], () => removePods(lost, false));
    return true;
  }
  return false;
}

// --- EndpointSlice controller + kube-proxy programming ---
async function endpointsController() {
  for (const s of S.services) {
    const eps = S.pods.filter(p => p.ready && live(p) && matches(s.selector, p.labels)).map(p => p.name).sort();
    const sig = eps.join(',');
    if (s.epSig === sig) continue;
    const proxies = S.nodes.filter(n => n.ready).map(n => ['api', 'proxy:' + n.name, C.watch]);
    await step(`<b>EndpointSlice controller</b>: Service <b>${s.name}</b> (selector <code>${selStr(s.selector)}</code>) now has <b>${eps.length}</b> ready endpoint(s) → every <b>kube-proxy</b> rewrites its iptables rules.`,
      [['api','cm',C.watch],['cm','api',C.req], proxies.length ? proxies : []].filter(h => h.length), () => { s.epSig = sig; s.endpoints = eps; });
    return true;
  }
  return false;
}

async function writePath(desc, act, msg, etcdText) {
  await step(`<b>kubectl → kube-apiserver</b>: ${desc}. The API server authenticates you, checks <b>RBAC</b>, runs <b>admission controllers</b> and validates the object schema.`, [['kubectl','api',C.req]]);
  await step(etcdText || `API server persists the object in <b>etcd</b> — the single source of truth. Nothing has <i>run</i> yet; we only changed the desired state.`, [['api','etcd',C.write]], act);
  await step(`API server replies <b>2xx</b>; kubectl prints the result and exits. Everything else happens <i>asynchronously</i>: controllers watching the API server react.`, [['api','kubectl',C.ok]], () => (Array.isArray(msg) ? msg : [msg]).forEach(m => print(m)));
}
async function readPath(desc) {
  await step(`<b>kubectl → kube-apiserver</b>: GET ${desc}. Reads never involve the scheduler or controllers.`, [['kubectl','api',C.req]]);
  await step(`API server reads the objects from <b>etcd</b> (in reality usually from its watch cache).`, [['api','etcd',C.write],['etcd','api',C.write]]);
  await step(`API server returns JSON; kubectl formats it for you.`, [['api','kubectl',C.ok]]);
}
async function apiErr(msg, why) {
  await step(`<b>kubectl → kube-apiserver</b>: request sent.`, [['kubectl','api',C.req]]);
  await step(`❌ API server rejects the request${why ? ': ' + why : ''}.`, [['api','kubectl',C.del]], () => print(msg, 'err'));
}
const notFound = (kind, name) => `Error from server (NotFound): ${{ pod:'pods', deployment:'deployments.apps', service:'services', node:'nodes', rs:'replicasets.apps' }[kind]} "${name}" not found`;
const err = m => print(m, 'err');

// ---- get ----
const LIST = {
  pod: { noun:'pods', prefix:'pod/', items:() => S.pods, find:findPod, manifest:podManifest,
    head:w => ['NAME','READY','STATUS','RESTARTS','AGE', ...(w ? ['IP','NODE','NOMINATED NODE','READINESS GATES'] : [])],
    row:(p, w) => [p.name, `${p.ready ? 1 : 0}/1`, podStatus(p), p.restarts, age(p.created), ...(w ? [p.ip || '<none>', p.nodeName || '<none>', '<none>', '<none>'] : [])] },
  node: { noun:'nodes', prefix:'node/', items:() => S.nodes, find:findNode, manifest:nodeManifest, cluster:true,
    head:w => ['NAME','STATUS','ROLES','AGE','VERSION', ...(w ? ['INTERNAL-IP','EXTERNAL-IP','OS-IMAGE','KERNEL-VERSION','CONTAINER-RUNTIME'] : [])],
    row:(n, w) => [n.name, nodeStatusStr(n), '<none>', age(n.created), K8S_VERSION, ...(w ? [n.ip, '<none>', 'Ubuntu 22.04.4 LTS', '5.15.0-105-generic', 'containerd://1.7.13'] : [])] },
  deployment: { noun:'deployments.apps', prefix:'deployment.apps/', items:() => S.deployments, find:findDep, manifest:depManifest,
    head:w => ['NAME','READY','UP-TO-DATE','AVAILABLE','AGE', ...(w ? ['CONTAINERS','IMAGES','SELECTOR'] : [])],
    row:(d, w) => { const s = depStatus(d); return [d.name, `${s.ready}/${d.replicas}`, s.updated, s.ready, age(d.created), ...(w ? [d.template.container, d.template.image, selStr(d.selector)] : [])]; } },
  rs: { noun:'replicasets.apps', prefix:'replicaset.apps/', items:() => S.replicasets, find:findRS, manifest:rsManifest,
    head:w => ['NAME','DESIRED','CURRENT','READY','AGE', ...(w ? ['CONTAINERS','IMAGES','SELECTOR'] : [])],
    row:(r, w) => [r.name, r.replicas, podsOfRS(r).filter(live).length, readyCount(r), age(r.created), ...(w ? [r.template.container, r.template.image, selStr(r.selector)] : [])] },
  service: { noun:'services', prefix:'service/', items:() => [{ kubeSvc:true, name:'kubernetes' }, ...S.services], find:findSvc, manifest:svcManifest,
    head:w => ['NAME','TYPE','CLUSTER-IP','EXTERNAL-IP','PORT(S)','AGE', ...(w ? ['SELECTOR'] : [])],
    row:(s, w) => s.kubeSvc ? ['kubernetes','ClusterIP','10.96.0.1','<none>','443/TCP', age(S.t0), ...(w ? ['<none>'] : [])]
      : [s.name, s.type, s.clusterIP, s.type === 'LoadBalancer' ? (s.externalIP || '<pending>') : '<none>', s.nodePort ? `${s.port}:${s.nodePort}/TCP` : `${s.port}/TCP`, age(s.created), ...(w ? [selStr(s.selector)] : [])] },
};
function eventsTable() {
  const evs = [...S.events].sort((a, b) => a.time - b.time);
  if (!evs.length) return 'No resources found in default namespace.';
  return table([['LAST SEEN','TYPE','REASON','OBJECT','MESSAGE'], ...evs.map(e => [age(e.time), e.type, e.reason, e.obj, e.msg])]);
}

const CMDS = {
  async get(args, flags) {
    let [t, name] = args;
    if (!t) return err('You must specify the type of resource to get. Use "kubectl api-resources" for a complete list of supported resources.\n\nerror: Required resource not specified.\nUse "kubectl explain <resource>" for a detailed description of that resource (e.g. kubectl explain pods).\nSee \'kubectl get -h\' for help and examples');
    if (t.includes('/')) [t, name] = t.split('/');
    const out = flags.output;
    if (out && out !== true && !['wide','yaml','name'].includes(out)) return err(`error: unable to match a printer suitable for the output format "${out}", allowed formats are: custom-columns,go-template,json,jsonpath,name,template,wide,yaml`);
    const kinds = t === 'all' ? ['pod','service','deployment','rs'] : t.split(',').map(x => KIND[x]);
    const badKind = t.split(',').find(x => t !== 'all' && !KIND[x]);
    if (badKind !== undefined) return apiErr(`error: the server doesn't have a resource type "${badKind}"`, 'unknown resource type');
    if (kinds.length > 1 && kinds.includes('event')) return err('error: events cannot be combined with other resource types in this simulator');
    const ns = flags.namespace && flags.namespace !== true ? flags.namespace : 'default';
    await readPath(`/${kinds.map(k => PLURAL[k]).join(',')}${name ? '/' + name : ''}`);
    if (kinds[0] === 'event') return print(ns === 'default' ? eventsTable() : `No resources found in ${ns} namespace.`);
    if (ns !== 'default' && kinds[0] !== 'node') return print(`No resources found in ${ns} namespace.`);
    const wide = out === 'wide', blocks = [];
    for (const k of kinds) {
      const L = LIST[k];
      if (name) {
        const o = L.find(name);
        if (!o) return err(notFound(k, name));
        if (out === 'yaml') return print(yaml(L.manifest(o)));
        if (out === 'name') return print(L.prefix + o.name);
        return print(table([L.head(wide), L.row(o, wide)]));
      }
      const items = L.items();
      if (!items.length) continue;
      if (out === 'name') { blocks.push(items.map(o => L.prefix + o.name).join('\n')); continue; }
      if (out === 'yaml') { blocks.push(yaml({ apiVersion:'v1', kind:'List', items:items.filter(o => !o.kubeSvc).map(L.manifest) })); continue; }
      const head = L.head(wide); if (kinds.length > 1) head[0] = 'NAME';
      blocks.push(table([head, ...items.map(o => { const r = L.row(o, wide); if (kinds.length > 1) r[0] = L.prefix + r[0]; return r; })]));
    }
    print(blocks.length ? blocks.join('\n\n') : kinds[0] === 'node' ? 'No resources found' : `No resources found in ${ns} namespace.`);
  },

  async describe(args) {
    const { kind, name } = target(args);
    if (!kind || !['pod','node','deployment','service'].includes(kind)) return apiErr(`error: the server doesn't have a resource type "${args[0] || ''}"`, 'unknown resource type');
    if (!name) return err(`error: you must specify the name of the resource to describe`);
    const o = { pod:findPod, node:findNode, deployment:findDep, service:findSvc }[kind](name);
    if (!o) return apiErr(notFound(kind, name), 'object not found');
    await readPath(`${kind}/${name} + related events`);
    print({ pod:describePod, node:describeNode, deployment:describeDeployment, service:describeService }[kind](o));
  },

  async run(args, flags) {
    const name = args[0];
    if (!name) return err('error: NAME is required for run\nSee \'kubectl run -h\' for help and examples');
    if (!flags.image || flags.image === true) return err('error: required flag(s) "image" not set');
    if (!DNS1123.test(name)) return apiErr(`The Pod "${name}" is invalid: metadata.name: Invalid value: "${name}": a lowercase RFC 1123 subdomain must consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character`, 'invalid name');
    if (!IMAGE_RE.test(flags.image)) return err(`error: invalid image name "${flags.image}": invalid reference format`);
    if (findPod(name)) return apiErr(`Error from server (AlreadyExists): pods "${name}" already exists`, 'already exists');
    await writePath(`POST /api/v1/namespaces/default/pods (a <b>bare Pod</b>, image <code>${esc(flags.image)}</code>)`,
      () => S.pods.push(makePod({ name, labels:{ run:name }, image:flags.image, container:name, cpu:flags['requests-cpu'] ? parseCPU(flags['requests-cpu']) : DEF_CPU })),
      `pod/${name} created`);
    await step(`ℹ️ This is a <b>bare pod</b>: no ReplicaSet owns it, so if it dies or its node fails nothing recreates it. Use a Deployment for self-healing.`);
  },

  async create(args, flags) {
    const [sub, name] = args;
    if (!['deployment','deploy'].includes(sub)) return err(sub ? `error: unknown command "${sub}" for "kubectl create" (this simulator supports: create deployment)` : 'error: must specify one of -f and -k\n\nCreate a resource from a file or from stdin.');
    if (!name) return err('error: exactly one NAME is required, got 0');
    if (!flags.image || flags.image === true) return err('error: required flag(s) "image" not set');
    if (!DNS1123.test(name)) return apiErr(`The Deployment "${name}" is invalid: metadata.name: Invalid value: "${name}": a lowercase RFC 1123 subdomain must consist of lower case alphanumeric characters`, 'invalid name');
    if (!IMAGE_RE.test(flags.image)) return err(`error: invalid image name "${flags.image}": invalid reference format`);
    const replicas = flags.replicas === undefined ? 1 : parseInt(flags.replicas, 10);
    if (isNaN(replicas) || replicas < 0 || replicas > 40) return err('error: --replicas must be a number between 0 and 40 in this simulator');
    if (findDep(name)) return apiErr(`Error from server (AlreadyExists): deployments.apps "${name}" already exists`, 'already exists');
    await writePath(`POST /apis/apps/v1/namespaces/default/deployments (<b>${name}</b>: ${replicas} × <code>${esc(flags.image)}</code>)`,
      () => S.deployments.push(makeDeployment({ name, image:flags.image, replicas })), `deployment.apps/${name} created`,
      `The Deployment (desired state: <b>${replicas}</b> replica(s) of <code>${esc(flags.image)}</code>) is stored in <b>etcd</b>. No ReplicaSet or Pod exists yet!`);
  },

  async scale(args, flags) {
    const { kind, name } = target(args);
    if (kind !== 'deployment') return err(`error: this simulator can scale deployments only (got "${args[0] || ''}")`);
    if (flags.replicas === undefined) return err('error: required flag(s) "replicas" not set');
    const n = parseInt(flags.replicas, 10);
    if (isNaN(n) || n < 0 || n > 40) return err('error: --replicas must be a number between 0 and 40 in this simulator');
    const d = findDep(name);
    if (!d) return apiErr(notFound('deployment', name), 'not found');
    await writePath(`PATCH /apis/apps/v1/namespaces/default/deployments/${name}/scale (replicas ${d.replicas} → <b>${n}</b>)`,
      () => d.replicas = n, `deployment.apps/${name} scaled`, `Only <code>spec.replicas</code> changes in etcd: ${d.replicas} → <b>${n}</b>. The controllers will close the gap.`);
  },

  async set(args) {
    if (args[0] !== 'image') return err(`error: unknown command "${args[0] || ''}" for "kubectl set" (supported: image)`);
    const { kind, name, rest } = target(args.slice(1));
    if (kind !== 'deployment') return err('error: usage: kubectl set image deployment/NAME CONTAINER=IMAGE');
    const d = findDep(name);
    if (!d) return apiErr(notFound('deployment', name), 'not found');
    const pairs = (rest || []).filter(x => x.includes('='));
    if (!pairs.length) return err('error: at least one image update is required');
    const [c, img] = pairs[0].split('=');
    if (c !== d.template.container && c !== '*') return err(`error: unable to find container named "${c}"\nHint: the container in deployment/${name} is named "${d.template.container}"`);
    if (!IMAGE_RE.test(img)) return err(`error: invalid image name "${img}": invalid reference format`);
    if (img === d.template.image) { await readPath(`deployment/${name}`); return print(`(no change: deployment.apps/${name} already uses ${img})`, 'info'); }
    await writePath(`PATCH deployment/${name}: <code>spec.template.spec.containers[${c}].image = ${esc(img)}</code>`,
      () => d.template.image = img, `deployment.apps/${name} image updated`,
      `The <b>pod template</b> changed in etcd (new template hash) — this is what triggers a <b>rolling update</b>.`);
  },

  async rollout(args) {
    const sub = args[0], { kind, name } = target(args.slice(1));
    if (!['status','undo','history'].includes(sub)) return err(`error: unknown command "${sub || ''}" for "kubectl rollout"\nAvailable: history, status, undo`);
    if (kind !== 'deployment') return err(`error: usage: kubectl rollout ${sub} deployment/NAME`);
    const d = findDep(name);
    if (!d) return apiErr(notFound('deployment', name), 'not found');
    if (sub === 'history') {
      await readPath(`replicasets owned by deployment/${name}`);
      return print(`deployment.apps/${name}\n` + table([['REVISION','CHANGE-CAUSE'], ...rsOfDep(d).sort((a, b) => a.revision - b.revision).map(r => [r.revision, `<none>   (image: ${r.template.image})`])]));
    }
    if (sub === 'undo') {
      const cur = depStatus(d).newRS;
      const prev = rsOfDep(d).filter(r => r !== cur).sort((a, b) => b.revision - a.revision)[0];
      if (!prev) return apiErr(`error: no rollout history found for deployment "${name}"`, 'no previous revision');
      const maxRev = Math.max(...rsOfDep(d).map(r => r.revision));
      return writePath(`PATCH deployment/${name}: copy the pod template of <b>revision ${prev.revision}</b> (image <code>${esc(prev.template.image)}</code>) back into the Deployment`,
        () => { d.template = clone(prev.template); prev.revision = maxRev + 1; d.revision = prev.revision; S.stats.undo++; },
        `deployment.apps/${name} rolled back`,
        `Rollback = just another template change. The old ReplicaSet ${prev.name} matches again, becomes revision ${maxRev + 1}, and the rolling update runs in reverse.`);
    }
    await readPath(`deployment/${name} (watching rollout)`);
    let last = '';
    for (let i = 0; i < 100; i++) {
      const dd = findDep(name); if (!dd) return err(`error: deployment "${name}" was deleted`);
      const st = depStatus(dd), old = st.total - st.updated;
      const msg = st.updated < dd.replicas ? `Waiting for deployment "${name}" rollout to finish: ${st.updated} out of ${dd.replicas} new replicas have been updated...`
        : old > 0 ? `Waiting for deployment "${name}" rollout to finish: ${old} old replicas are pending termination...`
        : st.newReady < dd.replicas ? `Waiting for deployment "${name}" rollout to finish: ${st.newReady} of ${dd.replicas} updated replicas are available...` : null;
      if (!msg) return print(`deployment "${name}" successfully rolled out`, 'ok');
      if (msg !== last) { print(msg); last = msg; }
      await sleep(250);
    }
    print(`error: deployment "${name}" exceeded its progress deadline`, 'err');
    print('Hint: check `kubectl get pods` and `kubectl describe pod <name>` for the failing new pods.', 'hint');
  },

  async expose(args, flags) {
    const { kind, name } = target(args);
    if (kind !== 'deployment') return err('error: this simulator can expose deployments only: kubectl expose deployment NAME --port=80');
    const d = findDep(name);
    if (!d) return apiErr(notFound('deployment', name), 'not found');
    if (!flags.port || flags.port === true) return err(`error: couldn't find port via --port flag or introspection\nSee 'kubectl expose -h' for help and examples`);
    const type = flags.type && flags.type !== true ? flags.type : 'ClusterIP';
    if (!['ClusterIP','NodePort','LoadBalancer'].includes(type)) return err(`error: The Service "${name}" is invalid: spec.type: Unsupported value: "${type}": supported values: "ClusterIP", "ExternalName", "LoadBalancer", "NodePort"`);
    const sname = flags.name && flags.name !== true ? flags.name : name;
    if (findSvc(sname)) return apiErr(`Error from server (AlreadyExists): services "${sname}" already exists`, 'already exists');
    await createService({ name:sname, type, selector:{ ...d.selector }, port:+flags.port, targetPort:+(flags['target-port'] || flags.port) }, `service/${sname} exposed`);
  },

  async delete(args, flags) {
    const { kind, raw } = target(args);
    let names = args[0] && args[0].includes('/') ? [args[0].split('/')[1]] : args.slice(1);
    if (!kind || !['pod','deployment','service','node','rs'].includes(kind)) return apiErr(`error: the server doesn't have a resource type "${raw || ''}"`, 'unknown resource type');
    if (flags.all && kind === 'pod') names = S.pods.map(p => p.name);
    if (!names.length) return err('error: resource(s) were provided, but no name was specified');
    for (const name of names) {
      if (kind === 'pod') {
        const p = findPod(name);
        if (!p) { await apiErr(notFound('pod', name), 'not found'); continue; }
        await writePath(`DELETE /api/v1/namespaces/default/pods/${name}`, () => {
          if (!S.pods.includes(p)) return;
          const d = depOfPod(p); if (d) S.stats.deletedFrom.add(d.name);
          markDelete(p);
        }, `pod "${name}" deleted`, `API server sets <code>deletionTimestamp</code> → pod is <b>Terminating</b>. The kubelet on its node will do the actual killing.`);
        if (p.owner) await step(`🩹 <b>Self-healing ahead:</b> ${name} is owned by ReplicaSet ${p.owner}. Its controller will see actual &lt; desired and create a replacement.`);
      } else if (kind === 'deployment') {
        const d = findDep(name);
        if (!d) { await apiErr(notFound('deployment', name), 'not found'); continue; }
        await writePath(`DELETE /apis/apps/v1/namespaces/default/deployments/${name} (propagationPolicy=Background)`,
          () => { S.deployments = S.deployments.filter(x => x !== d); }, `deployment.apps "${name}" deleted`,
          `Deployment removed from etcd. Its ReplicaSets and Pods still exist for a moment — the <b>garbage collector</b> will cascade the delete.`);
      } else if (kind === 'rs') {
        const r = findRS(name);
        if (!r) { await apiErr(notFound('rs', name), 'not found'); continue; }
        await writePath(`DELETE replicaset/${name}`, () => { S.replicasets = S.replicasets.filter(x => x !== r); }, `replicaset.apps "${name}" deleted`);
      } else if (kind === 'service') {
        const s = findSvc(name);
        if (!s) { await apiErr(notFound('service', name), 'not found'); continue; }
        await writePath(`DELETE /api/v1/namespaces/default/services/${name}`, () => { S.services = S.services.filter(x => x !== s); }, `service "${name}" deleted`);
        await step(`Every <b>kube-proxy</b> sees the Service vanish and removes its iptables rules; ClusterIP ${s.clusterIP} is released.`, [S.nodes.filter(n => n.ready).map(n => ['api', 'proxy:' + n.name, C.del])].filter(h => h.length));
      } else if (kind === 'node') {
        const n = findNode(name);
        if (!n) { await apiErr(notFound('node', name), 'not found'); continue; }
        await writePath(`DELETE /api/v1/nodes/${name}`, () => { S.nodes = S.nodes.filter(x => x !== n); }, `node "${name}" deleted`,
          `Node object removed. (The machine may still be running, but the cluster forgets it.) <b>PodGC</b> will clean up its pods.`);
      }
    }
  },

  async cordon(args) { return cordonCmd(args[0], true); },
  async uncordon(args) { return cordonCmd(args[0], false); },

  async drain(args, flags) {
    const n = findNode(args[0]);
    if (!args[0]) return err('error: USAGE: drain NODE [flags]');
    if (!n) return apiErr(notFound('node', args[0]), 'not found');
    if (!n.unschedulable) await writePath(`PATCH node/${n.name} spec.unschedulable=true`, () => n.unschedulable = true, `node/${n.name} cordoned`, `Step 1 of drain = <b>cordon</b>: the scheduler will no longer place pods here.`);
    else print(`node/${n.name} already cordoned`);
    const pods = S.pods.filter(p => p.nodeName === n.name && live(p));
    const bare = pods.filter(p => !p.owner);
    if (bare.length && !flags.force) {
      await step(`❌ Drain refuses to evict <b>bare pods</b> (${bare.map(p => p.name).join(', ')}): nothing would recreate them. Use <code>--force</code> to accept losing them.`);
      print(`error: unable to drain node "${n.name}" due to error: cannot delete Pods that declare no controller (use --force to override): ${bare.map(p => 'default/' + p.name).join(', ')}, continuing command...\nThere are pending nodes to be drained:\n ${n.name}\ncannot delete Pods that declare no controller (use --force to override): ${bare.map(p => 'default/' + p.name).join(', ')}`, 'err');
      return;
    }
    if (bare.length) print(`Warning: deleting Pods that declare no controller: ${bare.map(p => 'default/' + p.name).join(', ')}`, 'hint');
    if (!pods.length) { S.stats.drained++; return print(`node/${n.name} drained`); }
    pods.forEach(p => print(`evicting pod default/${p.name}`));
    await step(`Step 2 of drain: kubectl POSTs an <b>Eviction</b> for each pod (respecting PodDisruptionBudgets). Owned pods will be recreated by their ReplicaSets on <i>other</i> nodes.`,
      [['kubectl','api',C.req],['api','etcd',C.del]], () => pods.forEach(p => { if (S.pods.includes(p)) markDelete(p); }));
    for (let i = 0; i < 80 && pods.some(p => S.pods.includes(p)); i++) await sleep(200);
    pods.forEach(p => print(`pod/${p.name} evicted`));
    S.stats.drained++;
    print(`node/${n.name} drained`);
  },

  async logs(args, flags) {
    let { kind, name } = args[0] && args[0].includes('/') ? target(args) : { kind:'pod', name:args[0] };
    if (!name) return err('error: expected \'logs [-f] [-p] (POD | TYPE/NAME) [-c CONTAINER]\'.\nPOD or TYPE/NAME is a required argument for the logs command');
    let p;
    if (kind === 'deployment') {
      const d = findDep(name);
      if (!d) return apiErr(notFound('deployment', name), 'not found');
      const pods = rsOfDep(d).flatMap(podsOfRS);
      p = pods.find(x => x.state === 'Running') || pods[0];
      if (!p) return err(`error: timed out waiting for the condition`);
      if (pods.length > 1) print(`Found ${pods.length} pods, using pod/${p.name}`, 'info');
    } else {
      p = findPod(name);
      if (!p) return apiErr(notFound('pod', name), 'not found');
    }
    const K = p.nodeName ? 'kubelet:' + p.nodeName : null;
    await step(`<b>kubectl → kube-apiserver</b>: GET pods/${p.name}/log. Logs are <i>not</i> stored in etcd…`, [['kubectl','api',C.req]]);
    if (!K || p.state !== 'Running') {
      return step(`…the API server would proxy to the kubelet, but the container isn't running.`, [['api','kubectl',C.del]], () =>
        print(`Error from server (BadRequest): container "${p.container}" in pod "${p.name}" is waiting to start: ${p.state === 'ImagePullBackOff' ? 'trying and failing to pull image' : 'ContainerCreating'}`, 'err'));
    }
    await step(`…the API server proxies to the <b>kubelet</b> on ${p.nodeName}, which reads the container's log file via the runtime.`, [['api',K,C.req],[K,'rt:' + p.nodeName,C.req],['rt:' + p.nodeName,K,C.ok],[K,'api',C.ok]]);
    await step(`Log stream returned to kubectl.`, [['api','kubectl',C.ok]], () => {
      const tail = flags.tail && flags.tail !== true ? parseInt(flags.tail, 10) : 0;
      print((tail ? p.logs.slice(-tail) : p.logs).join('\n') || '');
    });
  },

  async apply(args, flags) {
    if (!flags.filename) return err('error: must specify one of -f and -k');
    const text = await openYamlEditor();
    if (text == null) return print('apply cancelled', 'info');
    let docs;
    try { docs = parseYAMLDocs(text); } catch (e) { return err(`error: error parsing STDIN: error converting YAML to JSON: ${e.message}`); }
    if (!docs.length) return err('error: no objects passed to apply');
    for (const doc of docs) await applyDoc(doc);
  },
};

async function cordonCmd(name, on) {
  if (!name) return err(`error: USAGE: ${on ? 'cordon' : 'uncordon'} NODE [flags]`);
  const n = findNode(name);
  if (!n) return apiErr(notFound('node', name), 'not found');
  if (n.unschedulable === on) { await readPath('node/' + name); return print(`node/${name} already ${on ? 'cordoned' : 'uncordoned'}`); }
  await writePath(`PATCH node/${name} <code>spec.unschedulable=${on}</code>`, () => n.unschedulable = on, `node/${name} ${on ? 'cordoned' : 'uncordoned'}`,
    on ? `Node marked unschedulable (taint <code>node.kubernetes.io/unschedulable:NoSchedule</code>). Existing pods keep running; new pods won't land here.`
       : `Node is schedulable again. Note: existing pods are <b>not</b> moved back automatically.`);
}

async function createService(spec, msg) {
